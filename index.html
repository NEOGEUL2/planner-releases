<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#A3A3AD" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>기록</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-BbKGbTPH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DLinKW2V.css">
  </head>
  <body>
    <!-- 아이폰 화면 자동 업데이트 되돌리기 (lib/liveupdate.js): 새로 받은 화면이 25초 안에 제대로 못 뜨면 예전 화면으로.
         앱 코드가 망가져도 돌도록 여기에 짧게 둠 -->
    <script>
      (function () {
        try {
          var C = window.Capacitor, B = '0.20.10-bc2248d';
          if (!C || !C.isNativePlatform || !C.isNativePlatform() || !C.nativePromise) return;
          var get = function () { return JSON.parse(localStorage.getItem('girok-live') || '{}'); };
          var back = function () {
            var s = get(), b = s.back;
            s.bad = (s.bad || []).filter(function (x) { return x !== B; }).concat([B]).slice(-10);
            delete s.try;
            localStorage.setItem('girok-live', JSON.stringify(s));
            if (!b || !b.path) return;
            C.nativePromise('WebView', 'setServerBasePath', { path: b.path }).then(function () {
              if (b.persist) return C.nativePromise('WebView', 'persistServerBasePath', {});
            });
          };
          var s = get();
          if ((s.bad || []).indexOf(B) >= 0) return back();
          if (!s.try || s.try.id !== B) return;
          s.try.n = (s.try.n || 0) + 1;
          localStorage.setItem('girok-live', JSON.stringify(s));
          if (s.try.n > 3) return back();
          setTimeout(function () { var t = get().try; if (t && t.id === B) back(); }, 25000);
        } catch (e) {}
      })();
    </script>
    <!-- 시작 화면: 플랫 종이색 바탕 가운데 9칸 로고 (예전 화면을 고른 기기는 검은 바탕). 앱 화면이 뜨면 React가 이 내용을 바꿔 그림 -->
    <script>
      (function () {
        var bg = '#fafaf7', fg = '#121212';
        try {
          var u = JSON.parse(localStorage.getItem('yk-ui') || 'null');
          if (u && u.ui === 'classic') { bg = '#000'; fg = '#fff'; }
          else if (matchMedia('(prefers-color-scheme: dark)').matches) { bg = '#151514'; fg = '#e9e8e2'; }
        } catch (e) {}
        document.documentElement.style.setProperty('--boot-bg', bg);
        document.documentElement.style.setProperty('--boot-fg', fg);
      })();
    </script>
    <div id="root"><div id="boot-splash" style="position:fixed;inset:0;background:var(--boot-bg,#fafaf7);color:var(--boot-fg,#121212);display:grid;place-items:center;z-index:9999">
      <svg width="72" height="72" viewBox="0 0 64 64" fill="currentColor" aria-label="기록">
        <rect x="6" y="6" width="14" height="14" rx="3.6"/><rect x="25" y="6" width="14" height="14" rx="3.6"/><rect x="44" y="6" width="14" height="14" rx="3.6" opacity=".3"/>
        <rect x="6" y="25" width="14" height="14" rx="3.6"/><rect x="25" y="25" width="14" height="14" rx="3.6"/><rect x="44" y="25" width="14" height="14" rx="3.6"/>
        <rect x="6" y="44" width="14" height="14" rx="3.6" opacity=".3"/><rect x="25" y="44" width="14" height="14" rx="3.6"/><rect x="44" y="44" width="14" height="14" rx="3.6" opacity=".3"/>
      </svg>
    </div></div>
    <!-- 쉬는 시간 알림 창(#break=)은 시작 화면 없이 (알림이 뜰 때 검은 화면이 깜박이지 않게) -->
    <script>if (/^#break=/.test(location.hash)) document.getElementById('boot-splash').remove();</script>
  </body>
</html>
