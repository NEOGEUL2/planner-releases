let wkVW='';const _ovRenderVW=ovRender;ovRender=function(){wkVW=innerWidth+'x'+innerHeight;return _ovRenderVW.apply(this,arguments)};
addEventListener('message',e=>{if(e.data==='girok-review-sync'&&innerWidth&&wkVW!==innerWidth+'x'+innerHeight&&!$('#po').classList.contains('on')){try{render();ovRender()}catch(err){}}});

/* ---------- 트랙이 0곡인 앨범: 상세를 열 때·불러올 때 한 번 더 받아 채움 (가수로 찾은 앨범이 애플에서 곡 목록 없이 오던 것) ---------- */
const WK_TLTRY=new Set();
async function wkFillTL(it){if(!wkOn()||!it||it.cat!='u'||(it.tl&&it.tl.length)||WK_TLTRY.has(it.id))return false;
  const s=it.src||{},id=s.deezer?'dz:'+s.deezer:s.itunes;if(!id)return false;WK_TLTRY.add(it.id);
  try{const d=await wk({a:'detail',cat:'u',id,artist:artistOfW(it),title:it.title});const t=(d.tracks||[]).map(x=>({n:x.n,s:x.s}));if(!t.length)return false;
    it.tl=t;it.tracks=t.length;it.heard=[];it.fav=-1;it.mins=Math.round(t.reduce((a,x)=>a+x.s,0)/60);
    it.meta=/\d+곡/.test(it.meta)?it.meta.replace(/\d+곡/,t.length+'곡'):[it.meta,t.length+'곡'].filter(Boolean).join(' · ');it.rvt=Date.now();return true}catch(e){return false}}
const _wkMakeTL=wkMake;
wkMake=async function(cat,id,hint){const it=await _wkMakeTL(cat,id,hint);if(cat=='u'&&!it.tl.length){it.src=it.src||{};WK_TLTRY.delete(it.id);await wkFillTL(it)}return it};
if(typeof openCDD=='function'){const _openCDDTL=openCDD;
  openCDD=function(it){const r=_openCDDTL.apply(this,arguments);
    if(it&&it.cat=='u'&&(!it.tl||!it.tl.length))wkFillTL(it).then(ok=>{if(!ok)return;const po=$('#po');if(po.classList.contains('cdo')&&S.usel==it.id){po.className='';po.innerHTML='';openCDD(it)}else render()});
    return r}}
setTimeout(async()=>{for(const it of items.filter(i=>i&&i.cat=='u'&&i.tl&&!i.tl.length))await wkFillTL(it)},6000);

/* ---------- 앨범 상세(트랙 목록): 불러온 앨범의 credits 는 '℗ 2020 레이블' 같은 글자 한 줄이라 그대로 쓰면 열리다 멈췄음.
   글자면 기본 크레딧 + 맨 아래 줄로, 빠진 칸은 빈 목록으로 */
if(typeof cdalCredits=='function'){const _cdalCrW=cdalCredits;
  cdalCredits=function(it){const s=it&&it.credits,o=s&&typeof s=='object'?s:null,b=_cdalCrW(o?it:{...it,credits:null});
    return {l:Array.isArray(b.l)?b.l:[],r:Array.isArray(b.r)?b.r:[],note:b.note||'',foot:typeof s=='string'&&s.trim()?s.trim():b.foot||''}}}

/* ---------- 기록 지우기: 영화·음악·게임 상세 왼쪽 아래 (실수로 안 지우게 두 번 눌러요) ---------- */
const wkDelB=document.createElement('button');wkDelB.type='button';wkDelB.id='wkdel';wkDelB.hidden=true;wkDelB.textContent='기록 지우기';document.body.appendChild(wkDelB);
let wkDelK=null,wkDelT=0;
function wkDelOn(k){wkDelK=k;wkDelB.hidden=!k;wkDelB.dataset.k=k||'';wkDelB.classList.remove('arm');wkDelB.textContent='기록 지우기';clearTimeout(wkDelT)}
function wkDrop(id){const k=items.findIndex(i=>i.id==id);if(k>=0)items.splice(k,1)}
wkDelB.onclick=()=>{if(!wkDelK)return;
  if(!wkDelB.classList.contains('arm')){wkDelB.classList.add('arm');wkDelB.textContent='한 번 더 누르면 지워요';clearTimeout(wkDelT);wkDelT=setTimeout(()=>wkDelOn(wkDelK),3500);return}
  const k=wkDelK;wkDelOn(null);
  if(k=='u'){const b=$('#po [data-del]');if(b){b.click();return}if(draft){const id=draft.id;draft._gone=true;closePO(()=>{wkDrop(id);render()});toast('지웠어요')}return}
  if(k=='m'){const id=MVD.id;mvdClose();wkDrop(id);render();toast('지웠어요');return}
  if(k=='g'){const id=GD.id;gdClose();wkDrop(id);render();if(OV.cat=='g')ovRender();toast('지웠어요')}};
if(typeof openCDD=='function'){const _openCDDDel=openCDD;openCDD=function(it){const r=_openCDDDel.apply(this,arguments);wkDelOn('u');return r}}
if(typeof closeCDD=='function'){const _closeCDDDel=closeCDD;closeCDD=function(){wkDelOn(null);return _closeCDDDel.apply(this,arguments)}}
if(typeof mvdOpen=='function'){const _mvdOpenDel=mvdOpen;mvdOpen=function(){const r=_mvdOpenDel.apply(this,arguments);wkDelOn('m');return r}}
if(typeof mvdClose=='function'){const _mvdCloseDel=mvdClose;mvdClose=function(){wkDelOn(null);return _mvdCloseDel.apply(this,arguments)}}
if(typeof gdOpen=='function'){const _gdOpenDel=gdOpen;gdOpen=function(){const r=_gdOpenDel.apply(this,arguments);if(GD.el)wkDelOn('g');return r}}
if(typeof gdClose=='function'){const _gdCloseDel=gdClose;gdClose=function(){wkDelOn(null);return _gdCloseDel.apply(this,arguments)}}

/* ── 앱 안 감상 기록: 듣기 기록 (Last.fm) ──
   앱(ReviewView)이 window.girokListen 을 넣어 줘요 (src/lib/listening.js: 아이디·받아오기·통계).
   - 음악 화면 '‹ ALL' 옆 'Last.fm' → 듣기 기록 시트 (이번 달·지난 달·올해 듣기 시간, 날마다 막대, 많이 들은 가수·앨범)
   - Last.fm 에서 들은 곡은 감상 앨범에서 '들음'으로 (처음 들은 날), 앨범 상세에 곡마다 들은 횟수 + LISTENED 시간
   없으면(미리보기 등) 아무것도 안 해요. */
const lsOn=()=>!!(window.girokListen&&typeof window.girokListen.stats=='function');
const lsArtist=it=>String(it.meta||'').split(' · ')[2]||'';
const lsKey=s=>String(s||'').toLowerCase().replace(/\s*[([].*?[)\]]\s*/g,' ').replace(/\s+-\s+.*(remaster|version|live|mix|edit).*$/i,'').replace(/[^\p{L}\p{N}]+/gu,'');
const LS_ALB=new Map();   /* 앨범 상세를 여는 동안만 쓰는 기록 */
function lsAlbum(it){if(!lsOn()||!it||it.cat!='u')return null;try{return it.lfa?window.girokListen.album(it.lfa[0],it.lfa[1]):window.girokListen.album(lsArtist(it),it.title)}catch(e){return null}}

/* Last.fm 에서 들은 곡 → '들음' (이미 들음이면 그대로) */
function lsApply(it,a){if(!a||!a.p||!it.tl||!it.tl.length)return false;let ch=false;it.heard=it.heard||[];
  it.tl.forEach((t,i)=>{const r=a.tracks[lsKey(t.n)];if(!r||it.heard.includes(i))return;it.heard.push(i);t.at=r.f;ch=true});
  if(ch)it.heard.sort((x,y)=>x-y);return ch}
let lsSeen=-1;
function lsApplyAll(){if(!lsOn())return;let at=0;try{at=window.girokListen.at()}catch(e){}if(!at||at==lsSeen)return;lsSeen=at;
  let ch=false;for(const it of items)if(it&&it.cat=='u'&&lsApply(it,lsAlbum(it)))ch=true;
  if(ch){S._cdxDirty=1;try{render();ovRender()}catch(e){}}}
setTimeout(lsApplyAll,5000);setInterval(lsApplyAll,60000);

/* 앨범 상세: 열 때 기록을 한 번 읽고, RUNTIME 옆에 LISTENED, 곡마다 '· 12회' */
const _cdalOpenL=cdalOpen;
cdalOpen=function(it,k){const a=lsAlbum(it);LS_ALB.set(it&&it.id,a);if(a)lsApply(it,a);_cdalOpenL(it,k);
  const rt=$('#cdal .alrt');if(a&&a.p&&rt){const s=a.s;rt.insertAdjacentHTML('afterend',`<div class="alrt lsrt"><span>LISTENED</span><span>${hms(Math.round(s))} · ${a.p}회</span></div>`)}};
const _cdalTkL=cdalTk;
cdalTk=function(it,i){const h=_cdalTkL(it,i),a=LS_ALB.get(it.id),r=a&&a.tracks[lsKey(it.tl[i].n)];
  return r?h.replace(' 들음</p>',` 들음 · ${r.p}회</p>`):h};

/* ---------- 듣기 기록 시트 ---------- */
const LS={per:'m'};
const lsPad=n=>String(n).padStart(2,'0');
const lsDay=d=>`${d.getFullYear()}-${lsPad(d.getMonth()+1)}-${lsPad(d.getDate())}`;
function lsRange(per){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  if(per=='y')return {f:`${y}-01-01`,t:`${y}-12-31`,y,label:`${y}년`};
  const d=per=='p'?new Date(y,m-1,1):new Date(y,m,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);
  return {f:lsDay(d),t:lsDay(e),y:d.getFullYear(),m:d.getMonth(),n:e.getDate(),label:`${d.getFullYear()}년 ${d.getMonth()+1}월`}}
function lsAgo(ms){if(!ms)return '아직 안 받음';const m=Math.round((Date.now()-ms)/60000);return m<1?'방금 받음':m<60?`${m}분 전 받음`:m<1440?`${Math.round(m/60)}시간 전 받음`:`${Math.round(m/1440)}일 전 받음`}
function lsSheet(){if(!lsOn())return;
  if(!window.girokListen.user())return lsSetup();
  wkSheet('듣기 기록','last.fm',`<div class="wkseg lsper">${[['m','이번 달','this month'],['p','지난 달','last month'],['y','올해','this year']].map(([k,n,e])=>`<button data-lsp="${k}" class="${LS.per==k?'on':''}">${n}<small>${e}</small></button>`).join('')}</div>
    <div id="lsb"></div>
    <div class="wkx"><button class="wkb" data-lsvt>노래 창고 · 발굴 <small>dig</small></button><button class="wkb" data-lsgo>새로 받기 <small>sync</small></button><button class="wkb" data-lsin>들은 앨범 넣기 <small>import</small></button><button class="wkb" data-lsid>아이디 바꾸기 <small>user</small></button></div>
    <p class="wkft"><span id="lsst">${wkEsc(window.girokListen.user())} · ${lsAgo(window.girokListen.at())}</span><span>Last.fm</span></p>`);
  const sh=$('#sheet');
  sh.querySelector('.lsper').onclick=e=>{const b=e.target.closest('[data-lsp]');if(!b)return;LS.per=b.dataset.lsp;sh.querySelectorAll('[data-lsp]').forEach(x=>x.classList.toggle('on',x==b));lsDraw()};
  sh.querySelector('.wkx').onclick=e=>{if(e.target.closest('[data-lsgo]'))lsSync();else if(e.target.closest('[data-lsid]'))lsSetup();else if(e.target.closest('[data-lsin]'))lsImport();else if(e.target.closest('[data-lsvt]'))lsVault()};
  lsDraw();
  if(Date.now()-window.girokListen.at()>30*60000)lsSync()}
async function lsSync(){const st=$('#lsst'),u=window.girokListen.user();
  try{await window.girokListen.sync(t=>{const s=$('#lsst');if(s&&t)s.textContent=t});lsSeen=-1;lsApplyAll();
    const s=$('#lsst');if(s)s.textContent=`${u} · ${lsAgo(window.girokListen.at())}`;lsDraw()}
  catch(e){const s=$('#lsst');if(s)s.textContent=/Last\.fm|아이디|비공개|LASTFM/.test(e.message)?e.message:WK_MSG(e)}}
function lsSetup(){const u=window.girokListen.user();
  wkSheet('듣기 기록 연결','last.fm',`<label class="wkin"><small>Last.fm 아이디 username</small><input id="lsu" placeholder="last.fm/user/ 뒤에 오는 이름" value="${wkEsc(u)}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <button class="wksave" data-lsok>연결하기</button><div class="wkres" id="res"></div>
    <p class="wkft"><span>스포티파이는 last.fm 설정 → Applications 에서 먼저 이어 두세요 · 처음엔 1년 치를 받아요</span><span>Last.fm</span></p>`);
  const go=async()=>{const v=$('#lsu').value.trim().replace(/^.*last\.fm\/user\//i,'').replace(/[/?#].*$/,'');if(!v)return;
    const res=$('#res'),b=$('[data-lsok]');b.disabled=true;res.innerHTML='<div class="wkm">기록 받는 중…</div>';window.girokListen.setUser(v);
    try{await window.girokListen.sync(t=>{if(t)res.innerHTML=`<div class="wkm">${wkEsc(t)}</div>`});lsSeen=-1;lsApplyAll();lsSheet()}
    catch(e){b.disabled=false;res.innerHTML=`<div class="wkm">${wkEsc(/Last\.fm|아이디|비공개|LASTFM/.test(e.message)?e.message:WK_MSG(e))}</div>`}};
  $('[data-lsok]').onclick=go;$('#lsu').onkeydown=e=>{if(e.key=='Enter')go()}}
function lsDraw(){const box=$('#lsb');if(!box)return;const R=lsRange(LS.per),s=window.girokListen.stats(R.f,R.t),hm=window.girokListen.hm;
  if(!s.plays){box.innerHTML=`<div class="wkm">${R.label}에 들은 기록이 없어요${window.girokListen.at()?'':' · 아래 새로 받기를 눌러 주세요'}</div>`;return}
  /* 막대: 달이면 날마다, 해면 달마다. 오늘(이번 달)만 진하게 */
  const today=lsDay(new Date());let bars=[];
  if(LS.per=='y')for(let m=0;m<12;m++){const p=`${R.y}-${lsPad(m+1)}`;let v=0;for(const[d,o]of Object.entries(s.days))if(d.startsWith(p))v+=o.s;bars.push({v,l:m+1,on:today.startsWith(p)})}
  else for(let d=1;d<=R.n;d++){const k=`${R.y}-${lsPad(R.m+1)}-${lsPad(d)}`;bars.push({v:(s.days[k]||{}).s||0,l:d,on:k==today})}
  const mx=Math.max(...bars.map(b=>b.v),1),W=560,H=88,bw=W/bars.length;
  const svg=`<svg class="lsbar" viewBox="0 0 ${W} ${H+16}" preserveAspectRatio="none">${bars.map((b,i)=>{const h=b.v?Math.max(2,b.v/mx*H):0;return `<rect x="${(i*bw+bw*.18).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${h.toFixed(1)}" class="${b.on?'on':''}"><title>${b.l}${LS.per=='y'?'월':'일'} ${hm(b.v)}</title></rect>`}).join('')}
    ${bars.map((b,i)=>(LS.per=='y'||b.l==1||b.l%5==0)?`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H+13}">${b.l}</text>`:'').join('')}</svg>`;
  const days=Object.keys(s.days).length,have=lsHave();
  const row=(n,sub,v,tag)=>`<div class="lsr"><span class="lsn"><b>${wkEsc(n)}</b>${sub?`<small>${wkEsc(sub)}</small>`:''}</span>${tag||''}<span class="lsv">${hm(v.s)}<small>${v.p}회</small></span></div>`;
  box.innerHTML=`<div class="lsnum"><div><small>들은 시간 listened</small><b>${hm(s.secs)}</b></div><div><small>들은 곡 plays</small><b>${s.plays.toLocaleString()}</b></div><div><small>들은 날 days</small><b>${days}</b></div></div>
    <div class="lsch">${svg}</div>
    <div class="wkcap"><span>많이 들은 가수</span><span>top artists</span></div>${s.artists.slice(0,5).map(a=>row(a.a,'',a)).join('')}
    <div class="wkcap"><span>많이 들은 앨범</span><span>top albums</span></div>${s.albums.slice(0,5).map(a=>row(a.al,a.a,a,have.has(lsKey(a.a)+'\u0001'+lsKey(a.al))?'<i class="wkon">감상에 있음</i>':'')).join('')}
    <div class="wkcap"><span>많이 들은 곡</span><span>top tracks</span></div>${s.tracks.slice(0,5).map(a=>row(a.n,a.a,a)).join('')}`}

/* ---------- 들은 앨범 넣기: Last.fm 에서 들은 앨범 중 감상에 없는 것을 골라 넣기 ----------
   곡 목록·표지는 음악 추가처럼 iTunes(→Deezer)에서, 들은 곡만 '들음'(처음 들은 날), 날짜 = 앨범을 처음 들은 날 */
const lsAK=(a,al)=>lsKey(a)+'\u0001'+lsKey(al);
function lsHave(){const h=new Set();for(const i of items)if(i&&i.cat=='u'){h.add(lsAK(lsArtist(i),i.title));if(i.lfal)h.add(i.lfal)}return h}
function lsImport(){const s=window.girokListen.stats('',''),have=lsHave(),sel=new Set(),hm=window.girokListen.hm;
  const list=s.albums.filter(a=>!have.has(lsAK(a.a,a.al))).slice(0,150);
  wkSheet('들은 앨범 넣기','import from last.fm',`<div class="wkres" id="res"></div>
    <p class="wkft"><span>많이 들은 순 · 한 곡만 들은 앨범도 있어요 · 넣으면 들은 곡만 체크돼요</span><span>Last.fm</span></p>`);
  const res=$('#res');
  const draw=()=>{res.innerHTML=list.length?`<div class="wkcap"><span>감상에 없는 앨범 ${list.length}개 · 고른 ${sel.size}개</span><span>albums</span></div>
    ${list.map((a,k)=>`<button class="wkr${sel.has(k)?' on':''}" data-lsi="${k}"><span class="wkrt"><b>${wkEsc(a.al)}</b><small>${wkEsc(a.a)} · ${a.p}회 · ${hm(a.s)}</small></span><i class="wkck"></i></button>`).join('')}
    <button class="wksave" data-lsadd${sel.size?'':' disabled'}>고른 앨범 넣기</button>`:'<div class="wkm">들은 앨범이 모두 감상에 있어요</div>'};
  draw();
  res.onclick=e=>{const b=e.target.closest('[data-lsi]');if(b){const k=+b.dataset.lsi;sel.has(k)?sel.delete(k):sel.add(k);const sh=$('#sheet').scrollTop;draw();$('#sheet').scrollTop=sh;return}
    const ok=e.target.closest('[data-lsadd]');if(ok&&sel.size)lsImportAdd([...sel].map(k=>list[k]),ok)}}
async function lsImportAdd(list,btn){btn.disabled=true;let n=0,miss=[];
  for(const a of list){btn.textContent=`넣는 중… ${n}/${list.length}`;
    try{const r=await wk({a:'search',cat:'u',q:`${a.a} ${a.al}`}),A=wkNorm(a.a),T=wkNorm(a.al);
      const m=r.items.find(x=>wkNorm(x.artist)==A&&wkNorm(x.title)==T)||r.items.find(x=>wkNorm(x.artist)==A&&(wkNorm(x.title).includes(T)||T.includes(wkNorm(x.title))))||r.items.find(x=>wkNorm(x.artist)==A);
      if(!m){miss.push(a.al);continue}
      const it=await wkMake('u',m.id,{});it.lfal=lsAK(a.a,a.al);it.lfa=[a.a,a.al];
      const al=window.girokListen.album(a.a,a.al);lsApply(it,al);
      const first=Object.values(al.tracks).reduce((f,t)=>!f||t.f<f?t.f:f,'');if(first)it.date=first;
      it.status=it.tl.length&&it.heard.length>=it.tl.length?'done':it.heard.length?'doing':'want';
      items.push(it);n++}catch(e){miss.push(a.al)}}
  closeSheet();render();ovRender();toast(`앨범 ${n}개를 넣었어요${miss.length?` · 못 찾은 ${miss.length}개: ${miss.slice(0,3).join(', ')}${miss.length>3?' …':''}`:''}`)}

/* ---------- 노래 창고 · 발굴 (사용자 고름: A 창고 표 + B 한 장씩) ----------
   한 번이라도 들은 곡을 제목·가수·때만으로 보여 주고(표지 없음), 좋았던 곡은 ♥ (앱 state.lastfm.loved, 기기끼리 맞춤).
   렌즈: 다시 꺼내 보기 · 요즘 반복 중 · 한두 번 스친 곡 · 전부 · ♥. '발굴하기' = 다시 꺼내 볼 곡을 카드 한 장씩 (♥ / 넘기기)
   넘긴 곡은 이 기기에 60일 동안 기억('girok-dig-skip')했다가 다시 나와요. ♥ 곡은 '앨범 넣기'로 감상에 (들은 곡만 체크) */
const LSV={lens:'back',q:'',more:0,i:0};
const LSV_LENS=[['back','다시 꺼내 보기','rewind'],['now','요즘 반복 중','on repeat'],['once','한두 번','barely heard'],['all','전부','all'],['love','좋았던 곡','♥ loved']];
const LSV_RULE={back:[t=>t.old>=5&&t.r90==0,(a,b)=>b.old-a.old],now:[t=>t.r14>=3,(a,b)=>b.r14-a.r14],once:[t=>t.tot<=2,(a,b)=>a.last<b.last?1:-1],all:[()=>true,(a,b)=>b.tot-a.tot]};
const lsMon=()=>{const d=new Date(),o=[];for(let k=11;k>=0;k--){const x=new Date(d.getFullYear(),d.getMonth()-k,1);o.push([x.getFullYear(),x.getMonth()+1])}return o};
const lsYM=(y,m)=>`${y}년 ${m}월`;
function lsSkip(k,on){let o={};try{o=JSON.parse(localStorage.getItem('girok-dig-skip')||'{}')}catch(e){}
  const now=Date.now();for(const x in o)if(now-o[x]>60*864e5)delete o[x];
  if(k===undefined)return o;if(on)o[k]=now;else delete o[k];try{localStorage.setItem('girok-dig-skip',JSON.stringify(o))}catch(e){}return o}
function lsSpark(m,peak,w,h,cls){const mx=Math.max(...m,1),bw=w/12;
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${m.map((v,k)=>{const hh=v?Math.max(2,v/mx*(h-2)):0;return `<rect x="${(k*bw+bw*.15).toFixed(1)}" y="${(h-hh).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${hh.toFixed(1)}"${k==peak&&v?' class="hot"':''}/>`}).join('')}</svg>`}
function lsArch(){let A=[];try{A=window.girokListen.archive()}catch(e){}return A}
function lsVault(){if(!lsOn())return;LSV.more=0;
  wkSheet('노래 창고','listened tracks · dig',`<div class="wkseg lsl">${LSV_LENS.map(([k,n,e])=>`<button data-lsl="${k}">${n}<small>${e}</small></button>`).join('')}</div>
    <div class="lsvbar"><label class="wkin"><small>찾기 search</small><input id="lsvq" placeholder="곡·가수 이름" autocomplete="off" value="${wkEsc(LSV.q)}"></label><button class="lsdigb" data-lsdig>발굴하기<small>one at a time</small></button></div>
    <div id="lsv"></div>
    <p class="wkft"><span>제목·가수·들은 때만 모아요 (표지 없음) · 막대 = 지난 12달</span><span>Last.fm</span></p>`);
  const sh=$('#sheet');
  sh.querySelector('.lsl').onclick=e=>{const b=e.target.closest('[data-lsl]');if(!b)return;LSV.lens=b.dataset.lsl;LSV.more=0;lsVDraw()};
  $('#lsvq').oninput=e=>{LSV.q=e.target.value;LSV.more=0;lsVDraw()};
  sh.querySelector('[data-lsdig]').onclick=()=>{LSV.i=0;lsDig()};
  $('#lsv').onclick=e=>{const h=e.target.closest('[data-lsh]');if(h){const k=h.dataset.lsh,on=!window.girokListen.loved().includes(k);window.girokListen.love(k,on);
      h.classList.toggle('on',on);h.textContent=on?'♥':'♡';lsVCount();return}
    const m=e.target.closest('[data-lsmore]');if(m){LSV.more++;lsVDraw();return}
    const al=e.target.closest('[data-lsal]');if(al){const [a,b]=JSON.parse(al.dataset.lsal);lsImportAdd([{a,al:b}],al)}};
  lsVDraw()}
function lsVCount(){const b=$('#sheet [data-lsl="love"] small');if(b)b.textContent=`♥ ${window.girokListen.loved().length}곡`}
function lsVDraw(){const box=$('#lsv');if(!box)return;const A=lsArch(),L=new Set(window.girokListen.loved()),hm=lsMon();
  $('#sheet').querySelectorAll('[data-lsl]').forEach(b=>b.classList.toggle('on',b.dataset.lsl==LSV.lens));lsVCount();
  if(!A.length){box.innerHTML='<div class="wkm">아직 받은 듣기 기록이 없어요. 듣기 기록 시트에서 새로 받기를 눌러 주세요.</div>';return}
  let rows=LSV.lens=='love'?A.filter(t=>L.has(t.k)).sort((a,b)=>a.last<b.last?1:-1):A.filter(LSV_RULE[LSV.lens][0]).sort(LSV_RULE[LSV.lens][1]);
  const q=lsKey(LSV.q);if(q)rows=rows.filter(t=>lsKey(t.n+t.a+t.al).includes(q));
  const have=lsHave(),lim=120*(LSV.more+1),name=LSV_LENS.find(x=>x[0]==LSV.lens)[1];
  const sub=t=>LSV.lens=='back'?`${lsYM(...hm[t.peak])} 최고`:LSV.lens=='now'?`2주에 ${t.r14}번`:LSV.lens=='once'?t.last.replace(/-/g,'.'):'';
  box.innerHTML=`<div class="wkcap"><span>${rows.length.toLocaleString()}곡 · ${name}${q?' · 찾기':''}</span><span>${hm[0][1]}월 → ${hm[11][1]}월</span></div>`+
    (rows.length?rows.slice(0,lim).map(t=>`<div class="lsvr"><div class="lsn"><b>${wkEsc(t.n)}</b><small>${wkEsc(t.a)}${t.al?' · '+wkEsc(t.al):''} · 처음 ${t.first.slice(0,7).replace('-','.')} · 마지막 ${t.last.slice(0,7).replace('-','.')}</small></div>${lsSpark(t.m,t.peak,96,22,'lsspk')}<div class="lsv"><span>${t.tot}회</span><small>${sub(t)}</small></div>${LSV.lens=='love'&&t.al&&!have.has(lsAK(t.a,t.al))?`<button class="lsalb" data-lsal="${wkEsc(JSON.stringify([t.a,t.al]))}">앨범 넣기</button>`:''}<button class="lsheart${L.has(t.k)?' on':''}" data-lsh="${wkEsc(t.k)}" aria-label="좋았던 곡">${L.has(t.k)?'♥':'♡'}</button></div>`).join('')+(rows.length>lim?`<button class="wkr lsmore" data-lsmore><span class="wkrt"><b>더 보기</b><small>${rows.length-lim}곡 더</small></span></button>`:'')
    :`<div class="wkm">${LSV.lens=='love'?'아직 ♥한 곡이 없어요. 발굴하기로 다시 꺼내 볼 곡을 한 장씩 넘겨 보세요.':LSV.lens=='back'?'다시 꺼내 볼 곡이 아직 없어요. 기록이 몇 달 쌓이면 나와요.':'해당하는 곡이 없어요'}</div>`)}
/* B: 한 장씩 발굴 */
function lsDeck(){const L=new Set(window.girokListen.loved()),sk=lsSkip();return lsArch().filter(t=>t.old>=5&&t.r90<=1&&!L.has(t.k)&&!sk[t.k]).sort((a,b)=>b.old-a.old)}
function lsDig(){const deck=lsDeck(),hm=lsMon();
  wkSheet('오늘의 발굴','dig · one at a time',`<div class="wkcap"><span id="lsdn"></span><span>← 넘기기 · ♥ 좋았어 →</span></div><div class="lsstage" id="lsds"></div>
    <div class="wkx"><button class="wkb" data-lsback>‹ 노래 창고 <small>vault</small></button></div>`);
  $('#sheet [data-lsback]').onclick=()=>{LSV.lens='love';lsVault()};
  const draw=()=>{const st=$('#lsds');if(!st)return;$('#lsdn').textContent=`${Math.min(LSV.i+1,deck.length)} / ${deck.length}곡`;
    if(LSV.i>=deck.length){st.innerHTML=`<div class="lscard"><div class="lsbig">${deck.length?'오늘 발굴 끝':'꺼내 볼 곡이 아직 없어요'}</div><p class="lsst">${deck.length?`♥한 곡은 노래 창고의 '좋았던 곡'에 모였어요.`:'예전에 5번 넘게 듣고 요즘 안 듣는 곡이 생기면 여기에 나와요.'}</p></div>`;return}
    const t=deck[LSV.i],pk=t.m[t.peak];
    st.innerHTML=`<div class="lscard" id="lscd"><div><small class="lsey">다시 꺼내 보기</small><div class="lsbig">${wkEsc(t.n)}</div><div class="lsar">${wkEsc(t.a)}${t.al?' · '+wkEsc(t.al):''}</div></div>
      ${lsSpark(t.m,t.peak,300,40,'lslife')}<div class="lsmn">${hm.map(([y,m],k)=>k%3==0||k==11?`<span style="left:${(k+.5)/12*100}%">${m}월</span>`:'').join('')}</div>
      <div class="lsst">${pk?`<span><b>${lsYM(...hm[t.peak])}</b>에 ${pk}번 들었어요</span>`:''}<span>${t.r90?`요즘은 석 달에 ${t.r90}번`:`${t.last.slice(0,7).replace('-','년 ').replace(/년 0?/,'년 ')}월 뒤로 한 번도 안 들었어요`}</span><span>처음 들은 날 ${t.first.replace(/-/g,'.')} · 모두 ${t.tot}번</span></div>
      <div class="lsacts"><button data-lsd="skip">넘기기 ←</button><button class="yes" data-lsd="love">♥ 좋았어 →</button></div></div>`};
  const act=k=>{const c=$('#lscd');if(!c)return;const t=deck[LSV.i];if(k=='love')window.girokListen.love(t.k,true);else lsSkip(t.k,true);
    c.classList.add(k=='love'?'out-r':'out-l');setTimeout(()=>{LSV.i++;draw()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:240)};
  $('#lsds').onclick=e=>{const b=e.target.closest('[data-lsd]');if(b)act(b.dataset.lsd)};
  const key=e=>{if(!$('#lsds')){removeEventListener('keydown',key);return}if(e.key=='ArrowRight')act('love');else if(e.key=='ArrowLeft')act('skip')};
  addEventListener('keydown',key);
  draw()}

/* ── 감상 기록 동기화 (앱 안, 로그인했을 때만) ──
보관함 review/items.json {v:1,at,items,del} + 그림 review/img/<번호> (창구: src/lib/reviewcloud.js → window.girokReviewCloud)
- 작품마다 rvu(기기 사이 같은 이름표)·rvt(마지막으로 고친 때). 두 기기에서 같은 작품을 고치면 나중에 고친 쪽이 남아요.
- 지운 작품은 del{rvu:때}로 다른 기기에서도 지움 (90일 뒤 잊음). id 는 기기마다 따로 (안 올림).
- 그림(data:image/…;base64)은 한 장씩 따로 올리고 기록에는 'rvimg:<번호>'만. '_'로 시작하는 칸은 화면용이라 안 올림.
- rvn = 아직 한 번도 맞춰 보지 않은 예전 기록. 다른 기기의 같은 작품(종류+제목 또는 스팀 번호)과 만나면 내용이 많은 쪽을 남겨요. */
const RS_IMG=/^data:image\/(png|jpeg|webp|gif);base64,/,RS_KEEP=90*864e5;
let rsSnap=new Map(),rsDel={},rsBusy=false,rsAgain=false,rsSeen=undefined,rsPush=0,rsHave=null,rsHC=new Map(),rsImg=new Map(),rsFirst=true,rsBad='',rsTry=0,rsInit=false;
const rsCloud=()=>{try{const c=window.girokReviewCloud;return c&&c.user()?c:null}catch(e){return null}};
const rsCy=(s,seed)=>{let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0,k;i<s.length;i++){k=s.charCodeAt(i);a=Math.imul(a^k,2654435761);b=Math.imul(b^k,1597334677)}a=Math.imul(a^(a>>>16),2246822507);a^=Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507);b^=Math.imul(a^(a>>>13),3266489909);return(b>>>0).toString(36)+(a>>>0).toString(36)};
const rsHash=s=>rsCy(s,1)+rsCy(s,7)+s.length.toString(36);
const rsUid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
// 작품 → 올릴 글 (그림은 번호로). withT=false 는 바뀌었는지 볼 때 (rvt 빼고)
function rsStrip(it,withT,hc){return JSON.stringify(it,function(k,v){
  if(k&&(k[0]=='_'||k=='rvn'||(!withT&&k=='rvt')||(this===it&&k=='id')))return undefined;
  if(typeof v=='string'&&v.length>200&&RS_IMG.test(v)){let h=rsHC.get(v);if(!h){h=rsHash(v);rsHC.set(v,h)}hc&&hc.set(v,h);rsImg.set(h,v);return'rvimg:'+h}
  return v})}
// 바뀐 작품에 rvt 찍기, 없어진 작품은 del 에
function rsStamp(init){
  const now=Date.now(),seen=new Set();let ch=false;
  for(const it of items){if(!it||typeof it!='object')continue;
    if(!it.rvu){it.rvu=rsUid();if(init)it.rvn=1}
    seen.add(it.rvu);const j=rsStrip(it,false);
    if(rsSnap.get(it.rvu)!==j){if(rsSnap.has(it.rvu)||!it.rvt)it.rvt=now;rsSnap.set(it.rvu,j);ch=true}}
  for(const u of [...rsSnap.keys()])if(!seen.has(u)){rsSnap.delete(u);rsDel[u]=now;ch=true;rvPut('rvdel',JSON.stringify(rsDel)).catch(()=>{})}
  return ch}
function rsOut(){
  const hc=new Map();rsImg=new Map();
  const a=items.filter(it=>it&&it.rvu).map(it=>[it.rvu,rsStrip(it,true,hc)]).sort((x,y)=>x[0]<y[0]?-1:1);
  rsHC=hc;const cut=Date.now()-RS_KEEP;
  for(const u in rsDel)if(rsDel[u]<cut)delete rsDel[u];
  return a}
const rsDelStr=d=>JSON.stringify(Object.keys(d).sort().map(k=>[k,d[k]]));
const rsSame=(a,b)=>a.cat==b.cat&&(a.cat=='g'&&a.steam&&b.steam?a.steam==b.steam:String(a.title||'').trim().toLowerCase()==String(b.title||'').trim().toLowerCase());
async function rsPool(list,n,f){let i=0;await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{while(i<list.length)await f(list[i++])}))}
const rsRead=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(b)});
// 보관함 기록 → 이 기기 기록. 바뀐 게 있으면 true
function rsMerge(R,miss){
  let ch=0,add=0;
  for(const[u,t]of Object.entries(R.del||{}))if(!(rsDel[u]>=t)){rsDel[u]=t;ch=1}
  const by=new Map(items.filter(i=>i&&i.rvu).map(i=>[i.rvu,i]));
  for(const[u,t]of Object.entries(rsDel)){const l=by.get(u);if(l&&(l.rvt||0)<=t){const k=items.indexOf(l);if(k>=0)items.splice(k,1);by.delete(u);rsSnap.delete(u);ch=1}}
  const put=(l,o)=>{for(const k of Object.keys(l))if(k!='id')delete l[k];Object.assign(l,o)};
  for(const r of R.items||[]){
    if(!r||!r.rvu||rsDel[r.rvu]>=(r.rvt||0))continue;
    const s=JSON.stringify(r);
    if([...s.matchAll(/"rvimg:([0-9a-z]+)"/g)].some(m=>miss.has(m[1])))continue;
    const o=JSON.parse(s,(k,v)=>typeof v=='string'&&v.startsWith('rvimg:')?rsImg.get(v.slice(6))||v:v);
    let l=by.get(r.rvu);
    if(!l){const old=items.find(i=>i&&i.rvn&&rsSame(i,r));
      if(old){if(rsStrip(old,false).length>rsStrip(o,false).length){old.rvu=r.rvu;old.rvt=Date.now()}else put(old,o);delete old.rvn;l=old;by.set(r.rvu,l);rsSnap.set(l.rvu,rsStrip(l,false));ch=1;continue}}
    if(!l){if(!o.title&&!o.cat)continue;o.id=++id;items.push(o);by.set(r.rvu,o);rsSnap.set(r.rvu,rsStrip(o,false));ch=1;add++;continue}
    if((r.rvt||0)>(l.rvt||0)){put(l,o);rsSnap.set(l.rvu,rsStrip(l,false));ch=1}
  }
  if(ch)rvPut('rvdel',JSON.stringify(rsDel)).catch(()=>{});
  return ch?{add}:null}
function rsNote(t,bad){let n=document.getElementById('rssync');
  if(!n){n=document.createElement('div');n.id='rssync';n.style.cssText='position:fixed;left:12px;bottom:12px;z-index:2000;max-width:min(360px,calc(100vw - 24px));padding:8px 12px;border-radius:10px;background:#1b1b1b;color:#fff;font:500 12px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer';n.onclick=()=>n.hidden=true;document.body.appendChild(n)}
  n.textContent=t;n.hidden=false;clearTimeout(n._t);n._t=setTimeout(()=>n.hidden=true,bad?9000:3500)}
async function rsSync(){
  if(!rvReady||!rsInit)return;const c=rsCloud();if(!c)return;
  if(rsBusy){rsAgain=true;return}
  rsBusy=true;rsTry=Date.now();clearTimeout(rsPush);rsPush=0;
  try{
    rsStamp();rsOut();
    const txt=await c.get('items.json');let R=null;
    if(txt){R=JSON.parse(txt);if(!R||R.v!==1||!Array.isArray(R.items))throw new Error('보관함의 감상 기록 모양이 이상해요')}
    if(rsHave==null)rsHave=new Set(await c.list('img'));
    let got=null;
    if(R){
      const need=[...new Set([...txt.matchAll(/"rvimg:([0-9a-z]+)"/g)].map(m=>m[1]))].filter(h=>!rsImg.has(h)),miss=new Set();
      await rsPool(need,4,async h=>{try{const b=await c.get('img/'+h,'blob');if(!b)throw 0;rsImg.set(h,await rsRead(b));rsHave.add(h)}catch(e){miss.add(h)}});
      got=rsMerge(R,miss);
      if(got){rvLast=null;rvSave();try{render();ovRender()}catch(e){}}
    }
    rsStamp();const out=rsOut();
    const mine=out.map(x=>x[1]).join(',')+rsDelStr(rsDel);
    const theirs=R?R.items.filter(r=>r&&r.rvu).sort((x,y)=>x.rvu<y.rvu?-1:1).map(r=>JSON.stringify(r)).join(',')+rsDelStr(R.del||{}):null;
    if(mine!==theirs){
      const up=[...new Set(out.flatMap(x=>[...x[1].matchAll(/"rvimg:([0-9a-z]+)"/g)].map(m=>m[1])))].filter(h=>!rsHave.has(h));
      await rsPool(up,3,async h=>{const v=rsImg.get(h);if(!v)return;const b=await(await fetch(v)).blob();await c.put('img/'+h,b,b.type||'image/jpeg');rsHave.add(h)});
      await c.put('items.json',new Blob(['{"v":1,"at":'+Date.now()+',"items":['+out.map(x=>x[1]).join(',')+'],"del":'+JSON.stringify(rsDel)+'}'],{type:'application/json'}),'application/json');
    }
    let n=0;for(const it of items)if(it&&it.rvn){delete it.rvn;n=1}
    if(n){rvLast=null;rvSave()}
    if(got&&got.add&&rsFirst)rsNote(`다른 기기의 감상 기록 ${got.add}개를 받아 왔어요.`);
    if(rsBad){rsBad='';if(!got||!got.add)rsNote('감상 기록 동기화가 다시 돼요.')}
    rsFirst=false;
  }catch(e){
    const m=(e&&e.message)||String(e);
    if(m!==rsBad){rsBad=m;rsNote('감상 기록을 다른 기기와 맞추지 못했어요: '+m,1)}
    console.warn('[감상 동기화]',e);
  }finally{rsBusy=false;if(rsAgain){rsAgain=false;setTimeout(rsSync,500)}}
}
// 열 때: 지운 기록 목록 읽고, 화면을 먼저 그린 뒤(그림 번호 매기기가 무거워서) 처음 상태를 기억하고 맞추기
const _rsLoadW=rvLoad;
rvLoad=async function(){await _rsLoadW();try{const d=await rvGet('rvdel');if(d)rsDel=JSON.parse(d)||{}}catch(e){}
  setTimeout(()=>{rsStamp(1);rsSeen=rvLast;rsInit=true;setTimeout(rsSync,300)},2500)};
// 고치면 몇 초 뒤 올리기, 1분 반마다·다시 볼 때 받아오기
setInterval(()=>{if(!rvReady||!rsInit)return;if(rvLast!==rsSeen){rsSeen=rvLast;if(rsStamp()){clearTimeout(rsPush);rsPush=setTimeout(rsSync,5000)}}if(rsFirst&&!rsBusy&&Date.now()-rsTry>30000&&rsCloud())rsSync()},3000);
setInterval(()=>{if(document.visibilityState=='visible')rsSync()},90000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')rsSync();else if(rsPush){clearTimeout(rsPush);rsSync()}});
addEventListener('message',e=>{if(e.data==='girok-review-sync')rsSync();else if(e.data==='girok-review-save'&&rsPush)rsSync()});

/* ── 할 일 '볼 것·읽을 것'을 끝내면 감상에 넣기 ──
앱(ReviewView)이 끝낸 볼 것들을 window.girokWatchDone([{key,cat,name,tv,date}]) 으로 넘겨요 → [{key,rvu}] (넣은 것만).
- 감상에 같은 종류·같은 제목이 있으면(보고 싶어요·보는 중) '봤어요'로 바꾸고 본 날짜를 그 날로.
- 없으면 작품 검색(works)에서 제목이 맞는 걸 찾아 포스터·정보까지 넣고, 못 찾으면 제목만.
- src.todo = 할 일 번호라서 두 번 넣지 않아요 (다른 기기에서 또 넘겨도).
