   ReviewView 가 숨길 때 'girok-review-save', 다시 볼 때 'girok-review-sync' 를 보내요.
   숨긴 동안은 setInterval 로 도는 일(저장 확인·버튼 지켜보기·동기화 확인 등)을 건너뛰고, 그림 그리기(requestAnimationFrame)는 다시 볼 때까지 미뤄요.
   페이지 맨 앞(<head>)에서 돌아야 페이지가 만드는 타이머까지 감쌀 수 있어요. review-build.py 가 끼워요. */
(()=>{const W=window,si=W.setInterval.bind(W),raf=W.requestAnimationFrame.bind(W),caf=W.cancelAnimationFrame.bind(W);
  W.__rvPause=false;const held=new Map();let fake=-1;
  W.setInterval=function(f,ms,...a){if(typeof f!='function')return si(f,ms,...a);return si(function(){if(!W.__rvPause)return f.apply(this,arguments)},ms,...a)};
  W.requestAnimationFrame=function(cb){if(!W.__rvPause)return raf(cb);const k=fake--;held.set(k,cb);return k};
  W.cancelAnimationFrame=function(k){if(held.has(k))held.delete(k);else caf(k)};
  const resume=()=>{if(!W.__rvPause)return;W.__rvPause=false;const l=[...held.values()];held.clear();l.forEach(cb=>raf(cb))};
  W.addEventListener('message',e=>{if(e.data==='girok-review-save')W.__rvPause=true;else if(e.data==='girok-review-sync')resume()})})();
</script>

<script id="review-img">/* SVG 그림 안에 넣을 img/… 파일을 data URL 로 (SVG 그림은 바깥 파일을 못 읽음) */
const rvInlC={};const rvInlD=u=>rvInlC[u]||(rvInlC[u]=fetch(u).then(r=>r.blob()).then(b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)})));
async function rvInl(s){const ks=[...new Set(s.match(/img%2F[0-9a-f]{16}\.(?:png|jpg|webp|gif)/g)||[])];if(!ks.length)return s;const ds=await Promise.all(ks.map(k=>rvInlD(decodeURIComponent(k))));ks.forEach((k,i)=>{s=s.split(k).join(encodeURIComponent(ds[i]))});return s}</script>

/* 감상 화면 토큰: 기본은 다크 (앱 테마와 따로) */
:root{
  --bg:#121215;--surface:#1b1b20;--surface-2:#222228;--tab:#26262d;--line:#2e2e36;--fg:#ececf1;--muted:#9696a3;
  --accent:#f29bb2;--accent-strong:#f5a6bd;--accent-soft:#3a2a31;--on-accent:#2a1820;--shadow:0 14px 34px -22px rgba(0,0,0,.8);
  --movie:#de3d55;--game:#5a6ad6;--book:#1e9a8a;--music:#cf7d26;--star:#f2c14e;
  --st-doing:#3fb98a;--st-done:#8fa8ec;--st-want:#a3a3b2;--st-drop:#ef6f6a;
  --wood:#4d4038;--woodd:#3b3029;--case:#2b2d31;--slot:#1c1d20;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-num:"Nunito","IBM Plex Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --stage-h:546px;--r-lg:22px;--r-md:14px;color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f5f3;--surface:#ffffff;--surface-2:#f4f3f0;--tab:#ebe9e5;--line:#e4e2dd;--fg:#2b2a28;--muted:#8a867f;
  --accent-strong:#d9688b;--accent-soft:#fde6ed;--on-accent:#fff;--shadow:0 14px 34px -22px rgba(0,0,0,.35);
  --movie:#d63a52;--game:#2f45a8;--book:#16897a;--music:#c46f1c;--star:#e0a526;
  --st-doing:#2f9e74;--st-done:#5f7fd0;--st-drop:#d9534f;--wood:#e3d3bf;--woodd:#c9b59c;color-scheme:light}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:760px;margin:0 auto;padding:16px 16px 96px;min-height:100vh}
.num{font-family:var(--font-num);font-weight:800}

.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.top h1{font-size:26px;letter-spacing:-1px;margin:0;font-weight:700}
.top .cnt{color:var(--muted);font-size:14px;margin-top:6px}
.top .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.ibtn.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.ibtn svg{width:19px;height:19px}
.add{background:var(--accent-strong);color:var(--on-accent);border-color:var(--accent-strong)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%}
.seg{display:flex;background:var(--tab);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg b{font-family:var(--font-num);font-weight:700;margin-left:3px;font-size:12.5px}
.row{display:flex;align-items:center;justify-content:space-between;margin:-4px 2px 10px;font-size:13px;color:var(--muted)}
.row select{border:0;background:none;color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:48px 0;font-size:14px}

/* 포스터 */
.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;width:100%;box-shadow:var(--shadow);background:#333}
.poster .pt{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;color:#fff;font-size:11px;font-weight:600;line-height:1.25;background:linear-gradient(transparent,rgba(0,0,0,.55));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .cd{position:absolute;left:6px;top:6px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff}
.poster .rw{position:absolute;right:5px;top:5px;font-size:10px;background:rgba(0,0,0,.4);color:#fff;border-radius:6px;padding:0 5px;font-family:var(--font-num);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:14px 10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
.cell{text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.stz{display:inline-flex;gap:.06em;vertical-align:-.12em}.stz svg{width:1em;height:1em;fill:currentColor;flex:none}
.stars{color:var(--star);font-size:12px;letter-spacing:.5px;height:16px;white-space:nowrap}
.minibar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.minibar i{display:block;height:100%;border-radius:2px}
.sm{font-size:11px;color:var(--muted);height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{visibility:hidden}

/* 책 · 표지 진열 선반 */
.bshelf{padding:4px 2px 0}
.brow{display:flex;gap:14px;padding:0 12px;align-items:flex-end}
.brow>*{flex:1;min-width:0}
.bcover{position:relative;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;box-shadow:3px 5px 10px -3px rgba(0,0,0,.35);background:#333}
.bcover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(255,255,255,.12) 60%,transparent);z-index:1}
.bcover .bt{position:absolute;left:12%;right:8%;top:8%;color:#fff;font-size:10.5px;font-weight:700;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.4);z-index:1}
.bcell{display:flex;flex-direction:column;align-items:stretch;gap:0}
.bcell .pg{height:3px;background:rgba(0,0,0,.12);margin:0 4px}
.bcell .pg i{display:block;height:100%;background:var(--book)}
.ledge{height:10px;margin:0 0 4px;background:var(--wood);border-radius:2px;position:relative;box-shadow:0 6px 8px -6px rgba(0,0,0,.25)}
.ledge::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:var(--woodd);border-radius:0 0 2px 2px}
.blab{display:flex;gap:14px;padding:6px 12px 18px}
.blab>*{flex:1;min-width:0;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blab .st{color:var(--star)}

/* 게임 · 카드 케이스 */
.gcase{background:var(--case);border-radius:24px;padding:12px 12px 14px;box-shadow:0 18px 30px -18px rgba(0,0,0,.6)}
.gcase-h{display:flex;justify-content:space-between;align-items:center;color:#c3c6cf;font-size:12px;padding:2px 6px 10px;border-bottom:1px solid #3a3c42;margin-bottom:12px}
.gcase-h b{color:#fff;font-family:var(--font-num);font-size:13px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (min-width:560px){.slots{grid-template-columns:repeat(6,1fr)}}
.slot{background:var(--slot);border-radius:12px;padding:8px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.slot .hh{font-size:10px;color:#8e929c;font-family:var(--font-num);font-weight:700;height:14px}
.gcard{position:relative;width:100%;aspect-ratio:44/52;clip-path:polygon(15% 0,100% 0,100% 100%,0 100%,0 13%);border-radius:6px;padding:14% 8% 21%;
  background:linear-gradient(155deg,color-mix(in srgb,var(--d) 62%,#fff) 0%,var(--d) 30%,var(--d) 62%,color-mix(in srgb,var(--d) 68%,#000) 100%)!important;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 2px 2px 0 rgba(255,255,255,.28),inset -2px -2px 0 rgba(0,0,0,.3)}
.gcard::before{content:"";position:absolute;left:24%;right:12%;top:4.5%;height:5%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 1.5px,rgba(255,255,255,.18) 1.5px 3px,transparent 3px 6px);border-radius:1px}
.gcard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 38%,transparent 70%,rgba(0,0,0,.18))}
.gcard .gl{position:relative;width:100%;height:100%;border-radius:3px;padding:4%;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.18) 60%,rgba(255,255,255,.14));box-shadow:inset 0 2px 3px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.3)}
.gcard .glw{position:relative;width:100%;height:100%;overflow:hidden;border-radius:2px;border-top:2px solid var(--a);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.4)}
.gcard .glw::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.08) 34%,transparent 35%,transparent 100%)}
.gcard .pins{position:absolute;left:14%;right:14%;bottom:5%;height:9%;border-radius:2px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.35));box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.2);padding:1.5% 3%}
.gcard .pins i{display:block;height:100%;background:repeating-linear-gradient(90deg,#d8b45a 0 7%,#f3dc96 7% 9%,transparent 9% 14.5%);border-radius:1px}
.slot.empty{min-height:80px}

/* 캘린더 */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 10px 10px}
.calh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.calh b{font-size:17px}
.calh button{width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:18px}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:11.5px;color:var(--muted);padding-bottom:4px}
.wk span:first-child{color:var(--movie)}
.day{aspect-ratio:3/4;border-radius:8px;position:relative;overflow:hidden;font-family:var(--font-num);font-size:12px;font-weight:700;color:var(--muted);padding-top:4px;text-align:center}
.day.today{color:var(--accent-strong);box-shadow:inset 0 0 0 1.5px var(--accent-strong)}
.day.has{padding:0;display:grid;gap:1.5px;background:var(--surface)}
.day.has .tile{position:relative;overflow:hidden}
.day.n2{grid-template-columns:1fr 1fr}
.day.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.day.n3 .tile:first-child{grid-row:1/3}
.day.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.day .dn{position:absolute;left:3px;top:3px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border-radius:4px;padding:0 4px;font-size:9.5px;line-height:14px}
.day .more{position:absolute;inset:0;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:11px;z-index:1}
.day.sel{outline:2px solid var(--fg);outline-offset:1px}
.cal{position:relative}
.cpop{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;box-shadow:0 18px 40px -12px rgba(60,20,40,.35);animation:popIn .22s cubic-bezier(.2,.8,.2,1);transform-origin:var(--ax) var(--oy)}
.cpop::before{content:"";position:absolute;left:calc(var(--ax) - 6px);width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.cpop.dn::before{top:-7px}.cpop.up::before{bottom:-7px;transform:rotate(225deg)}
@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.cpop h5{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:13px}
.cpop h5 button{color:var(--muted);font-size:18px;line-height:1;width:24px;height:24px}
.cpop .xs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.cpop .xi{flex:none;width:76px;text-align:left}
.cpop .xi .poster{box-shadow:none;border-radius:6px}
.cpop .xi b{display:block;font-size:11.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpop .xi small{white-space:nowrap;font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.cpop .xi small i{width:6px;height:6px;border-radius:50%}

/* 뽑아 보기 */
#po{position:fixed;inset:0;z-index:30;overflow-y:auto;visibility:hidden}
#po.on,#po.closing{visibility:visible}
#po .bgc{position:fixed;inset:-80px;filter:blur(50px) saturate(1.25);opacity:0;transition:opacity .4s}
#po .veil{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.16),rgba(0,0,0,.04) 50%,color-mix(in srgb,var(--bg) 70%,transparent) 100%);opacity:0;transition:opacity .4s}
#po.on .bgc,#po.on .veil{opacity:1}
.po-in{position:relative;max-width:900px;margin:0 auto;padding:12px 14px 24px}
.po-x{width:36px;height:36px;border-radius:12px;background:rgba(0,0,0,.25);color:#fff;font-size:20px;display:grid;place-items:center}
.po-g{display:grid;grid-template-columns:41% minmax(0,1fr);gap:14px;margin-top:10px;align-items:start}
@media (min-width:700px){.po-g{grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:30px;margin-top:22px}}
.po-l{position:sticky;top:10px;z-index:1}
.obj{position:relative}
.objv{position:relative;transform-origin:0 0}
.face{position:relative}
.obj .pages{position:absolute;top:2.5%;bottom:2.5%;right:-6px;width:6px;background:repeating-linear-gradient(to bottom,#f4ecdc 0 2px,#ddd0b6 2px 3px);border-radius:0 3px 3px 0;box-shadow:2px 2px 6px rgba(0,0,0,.2);animation:fin .25s .6s both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.obj .bcover,.obj .poster{box-shadow:0 22px 40px -14px rgba(0,0,0,.6)}
.obj .gcard{box-shadow:none;filter:drop-shadow(0 18px 22px rgba(0,0,0,.45))}
.tkw svg{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 20px rgba(0,0,0,.35))}
.tkw.stub svg{width:72%;margin:0 auto}
.tsel{display:flex;background:rgba(0,0,0,.24);border-radius:10px;padding:2px;margin-top:16px}
.tsel button{flex:1;padding:5px 0;border-radius:8px;font-size:11.5px;color:rgba(255,255,255,.88);white-space:nowrap}
.tsel button.on{background:#fff;color:#333;font-weight:600}
.po-r{position:relative;z-index:3;min-width:0;opacity:0;transform:translateX(14px);transition:opacity .35s .18s,transform .5s .18s cubic-bezier(.2,.8,.2,1)}
#po.on .po-r{opacity:1;transform:none}
#po.closing .po-r{transition-delay:0s,0s}
.info{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.25);min-width:0}
.info h2{margin:0 0 3px;font-size:19px;letter-spacing:-.5px;line-height:1.25}
.info .meta{font-size:12px;opacity:.85}
.info .bigstar{color:var(--star);font-size:15px;margin-top:6px;letter-spacing:1px;text-shadow:none}
.info .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.92);margin-top:7px;text-shadow:none}
.info .pill i{width:7px;height:7px;border-radius:50%}
.info .key{margin-top:7px;font-size:12px;opacity:.95}
.info .key b{font-family:var(--font-num);font-size:18px;font-weight:800;margin-right:3px}
.info .kbar{height:4px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:5px;overflow:hidden}
.info .kbar i{display:block;height:100%;background:#fff}
.info q{display:block;margin-top:7px;font-size:12.5px;opacity:.95;quotes:"“" "”"}
.po-body{background:var(--surface);border-radius:18px;padding:12px 12px 10px;margin-top:12px;box-shadow:var(--shadow)}
.po-body .lab{margin:11px 0 5px;font-size:11.5px}
.po-body .lab:first-child{margin-top:0}
.po-body .sts{grid-template-columns:1fr 1fr;gap:5px}
.po-body .sts button{flex-direction:row;justify-content:center;padding:6px 2px;font-size:12px;gap:5px;border-radius:9px}
.po-body .rate{flex-direction:row;flex-wrap:wrap;align-items:center;gap:0 8px;padding:0}
.po-body .rate .sv{gap:1px}
.po-body .rate .sv svg{width:27px;height:27px}
.po-body .rate .rv{font-size:17px;margin:0;min-height:0}
.po-body .rate .rw2{font-size:11.5px;min-height:0;width:100%}
.po-body .fld{gap:6px;flex-wrap:wrap}.po-body .fld input[type=date]{min-width:128px}
.po-body .fld input[type=date],.po-body .fld input[type=number]{padding:6px 8px;font-size:13px;border-radius:9px}
.po-body .mini{padding:6px 8px;font-size:12px;border-radius:9px}
.po-body .pbar{height:6px;margin-top:7px}
.po-body textarea{min-height:50px;font-size:13px;padding:8px 10px;border-radius:11px}
.po-body .chk{font-size:11.5px;margin-top:5px}
.po-body .save{margin-top:10px;padding:10px;font-size:14.5px;border-radius:12px}
.po-body .del{margin-top:0;padding:7px;font-size:12.5px}
@media (min-width:700px){.info h2{font-size:24px}.po-body{padding:16px 18px 12px}.po-body .sts{grid-template-columns:repeat(4,1fr)}.po-body .rate .sv svg{width:34px;height:34px}}
.fly{position:fixed;z-index:2;pointer-events:none;transform-origin:0 0;margin:0}

.pback{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;container-type:inline-size;color:var(--l);padding:8% 8% 0;display:flex;flex-direction:column;gap:0;box-shadow:0 22px 40px -14px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.12)}
.pbh b{display:block;font-size:7.5cqw;line-height:1.15;color:#fff}
.pbh span{font-size:4.6cqw;opacity:.75}
.pbs{margin-top:4cqw}.pbs em{display:block;font-style:normal;font-size:4.2cqw;font-weight:700;letter-spacing:.06em;color:var(--a);margin-bottom:1cqw}
.pbs p{margin:0;font-size:4.8cqw;line-height:1.35;opacity:.9}
.pbv div{display:flex;justify-content:space-between;font-family:var(--mono);font-size:4.6cqw;line-height:1.6;border-bottom:1px dashed color-mix(in srgb,var(--l) 30%,transparent)}
.pbv .pbr{border:0;justify-content:flex-start;gap:2cqw;align-items:center;color:var(--star);font-size:6cqw;margin-top:1.5cqw}
.pbv .pbr b{color:#fff;font-family:var(--font-num)}
.pbf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.28);margin-left:-8cqw;margin-right:-8cqw;padding:3cqw 8cqw;font-family:var(--mono);font-size:4.4cqw;opacity:.85}
.pbf .bc{width:38cqw;flex:none;height:7cqw;background:repeating-linear-gradient(90deg,var(--l) 0 1px,transparent 1px 3px,var(--l) 3px 5px,transparent 5px 6px);opacity:.7}
.face{cursor:default}
.fliph{margin:12px 0 0;text-align:center;font-size:11.5px;color:rgba(255,255,255,.8)}
.gback{position:relative;width:100%;aspect-ratio:44/52;clip-path:polygon(0 0,85% 0,100% 13%,100% 100%,0 100%);border-radius:6px;container-type:inline-size;color:var(--l);padding:9% 8% 18%;background:linear-gradient(205deg,color-mix(in srgb,var(--d) 62%,#fff) 0%,var(--d) 30%,var(--d) 62%,color-mix(in srgb,var(--d) 68%,#000) 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset -2px 2px 0 rgba(255,255,255,.25)}
.gback .gbi{height:100%;border-radius:3px;padding:6% 7%;background:rgba(0,0,0,.32);box-shadow:inset 0 2px 3px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.2);overflow:hidden}
.gback .pbs{margin-top:4cqw}
.gback .gno{position:absolute;left:8%;right:8%;bottom:5%;height:9%;display:flex;align-items:center;justify-content:flex-end;font-family:var(--mono);font-size:4.2cqw;opacity:.7;border-top:1px solid rgba(255,255,255,.15)}
/* 폼 */
.lab{font-size:12.5px;color:var(--muted);font-weight:600;margin:16px 0 7px}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sts button{padding:9px 2px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px}
.sts button i{width:8px;height:8px;border-radius:50%}
.sts button.on{border-color:currentColor;font-weight:700}
.rate{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 2px}
.rate .sv{display:flex;gap:6px;touch-action:none}
.rate .sv svg{width:42px;height:42px;cursor:pointer}
.rate .rv{font-size:22px;color:var(--fg);margin-top:4px;min-height:30px}
.rate .rw2{font-size:13px;color:var(--muted);min-height:20px}
.fld{display:flex;gap:8px;align-items:center}
.fld input[type=date],.fld input[type=number]{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 12px;min-width:0}
.fld .u{color:var(--muted);font-size:13px;white-space:nowrap}
.mini{padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;white-space:nowrap}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:9px}
.pbar i{display:block;height:100%;border-radius:4px}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:11px 13px;font-size:14.5px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-top:8px}
.save{margin-top:20px;width:100%;padding:13px;border-radius:14px;background:var(--accent-strong);color:var(--on-accent);font-weight:700;font-size:15.5px}
.del{margin-top:8px;width:100%;padding:10px;color:var(--muted);font-size:13.5px}

/* 시트 (작품 추가) */
.dim{position:fixed;inset:0;background:rgba(30,15,22,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:92vh;overflow-y:auto;transform:translate(-50%,105%);transition:transform .25s ease;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:11;padding:10px 18px 28px}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-top h2{margin:0;font-size:19px;letter-spacing:-.5px}
.x{color:var(--muted);font-size:22px;width:32px;height:32px}
.srch{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 14px;font-size:15px;margin-bottom:12px}
.res{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:12px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 12px 8px 8px;text-align:left;width:100%}
.li .poster{width:38px;flex:none;border-radius:5px;box-shadow:none}
.li .poster .pt,.li .poster .cd{display:none}
.li b{display:block;font-size:14.5px;font-weight:600}
.li small{color:var(--muted);font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}

/* 통계 */
.sbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.sbox h4{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.big{font-family:var(--font-num);font-weight:800;font-size:38px;line-height:1.1;letter-spacing:-1px}
.big small{font-family:var(--font-body);font-size:15px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.stack{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px;margin:12px 0 10px}
.leg{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;font-size:13px;align-items:center}
.leg i{width:9px;height:9px;border-radius:3px}
.leg span:nth-child(4n+3),.leg span:nth-child(4n){color:var(--muted);text-align:right;font-family:var(--font-num);font-weight:700}
.faded{opacity:.22}
.gr{display:grid;grid-template-columns:auto 1fr auto;gap:9px 10px;align-items:center;font-size:13.5px;margin-top:12px}
.gr .gb{height:14px;border-radius:4px;min-width:4px}
.gr .gv{font-size:12px;color:var(--muted);white-space:nowrap;font-family:var(--font-num);font-weight:700;text-align:right}
.gr .gv b{color:var(--star)}
.gctl{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0 12px}
.gctl .seg{margin:0;width:128px}
.ghead{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin-bottom:10px}
.pill2{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600}
.sbox svg{width:100%;height:auto;display:block}
.bcover{container-type:inline-size}
.bcover .bt{font-size:10.5cqw}
/* 영화 · 비디오테이프 더미 + 필름 스트립 */
.vs{background:transparent;border-radius:20px;padding:14px 0 16px;color:#eee;overflow:hidden;box-shadow:0 18px 30px -18px rgba(0,0,0,.6)}
.strip{position:relative;background:#0c0b0ee8;padding:18px 0;overflow:hidden;border-top:1px solid #000;border-bottom:1px solid #000}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:7px;background:repeating-linear-gradient(90deg,transparent 0 5px,#d8d2c6 5px 13px,transparent 13px 19px);opacity:.7}
.strip::before{top:5px}.strip::after{bottom:5px}
.track{display:flex;gap:12px;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.frm{flex:none;width:96px;opacity:.4;transform:scale(.9);transition:opacity .35s,transform .35s;border-radius:3px}
.frm.on{opacity:1;transform:none}
.frm .poster{border-radius:2px;box-shadow:none}
.vb{display:grid;grid-template-columns:57% minmax(0,1fr);gap:12px;padding:18px 14px 0;align-items:end}
.pile{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding-right:20px;max-width:320px;min-height:calc(8 * 31px + 7 * 2px)}
.tape{position:relative;height:24px;border-radius:3px;background:linear-gradient(#303036,#1c1c20);box-shadow:0 2px 0 #09090b,inset 0 1px 0 rgba(255,255,255,.08);transform:translateX(var(--off)) rotate(var(--rot));transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;display:flex;align-items:center;padding:0 6px 0 7px;text-align:left}
.tape .lb{flex:1;min-width:0;height:16px;border-radius:2px;background:var(--l);border-left:5px solid var(--a);display:flex;align-items:center;padding:0 6px;color:var(--d)}
.tape .lb b{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape .win{flex:none;width:20px;height:8px;margin-left:6px;border-radius:2px;background:#0b0b0e;box-shadow:inset 0 0 0 1px #3d3d44}
.tape.on{transform:translateX(calc(var(--off) + 18px)) rotate(0deg);box-shadow:0 2px 0 #09090b,0 0 0 1.5px var(--a),0 6px 14px rgba(0,0,0,.5);z-index:1}
.vinfo{min-width:0;padding-bottom:4px}
.vinfo h3{margin:0 0 2px;font-size:16px;line-height:1.3;color:#fff}
.vinfo .m{font-size:11.5px;color:#a9a6ae}
.vinfo .s{color:var(--star);font-size:13px;margin-top:6px}
.vinfo .s .num{color:#fff;margin-left:3px}
.vinfo .d{font-family:var(--mono);font-size:11px;color:#a9a6ae;margin-top:2px}
.vinfo button{margin-top:12px;padding:7px 12px;border-radius:10px;background:#fff;color:#222;font-size:12.5px;font-weight:600}
.vs{position:relative;isolation:isolate;height:var(--stage-h)}
.vbg{position:absolute;inset:0;z-index:-1;overflow:hidden;background:#111}
.vbi{position:absolute;inset:-40px}
.vbi .art{filter:blur(22px) brightness(.42) saturate(1.2);transform:scale(1.1)}
.vs::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% 40%,transparent,rgba(0,0,0,.45))}
.strip{margin:6px -14px 4px;transform:rotate(-1.6deg);box-shadow:0 10px 20px -8px rgba(0,0,0,.6)}
.strip .track{padding-left:14px}
.tape{height:31px}
.tape .lb{height:21px}
.tape .lb b{font-size:13px}
.tape .win{width:22px;height:9px}
.vpg{max-width:320px;display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;padding-right:20px;color:#cfccd4;font-size:12.5px}
.vpg button{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;line-height:1}
.vpg button:disabled{opacity:.3;cursor:default}
/* 책 · 서점 벽 진열 */
.bstore{height:var(--stage-h);display:flex;flex-direction:column;position:relative;border-radius:22px;overflow:hidden;isolation:isolate;background:linear-gradient(#f2e6d3,#e4d0b3);padding:16px 6px 10px;box-shadow:0 18px 30px -22px rgba(90,50,20,.6)}
.bstore .lamp{position:absolute;inset:0;z-index:-1;background:radial-gradient(38% 22% at 20% 0%,rgba(255,238,196,.95),transparent 70%),radial-gradient(38% 22% at 80% 0%,rgba(255,238,196,.95),transparent 70%),repeating-linear-gradient(90deg,transparent 0 60px,rgba(120,80,40,.05) 60px 61px)}
.bsign{width:max-content;margin:0 auto 18px;background:#2d2620;color:#f6e7c8;font-size:12.5px;letter-spacing:2px;padding:6px 16px;border-radius:4px;box-shadow:0 6px 10px -4px rgba(0,0,0,.5)}
.bsign b{color:#f2b56b;font-family:var(--font-num);margin-left:6px;letter-spacing:0}
.bstore .brow{transform:perspective(700px) rotateX(5deg);transform-origin:bottom}
.bstore .ledge{height:12px;margin:-1px 0 0;background:linear-gradient(#a57a52,#7b5638);box-shadow:0 8px 10px -6px rgba(0,0,0,.45)}
.bstore .ledge::after{display:none}
.bstore .blab{padding:7px 12px 20px}
.bstore .blab>*{color:#8a7058}
.bcell{position:relative}
.bnav{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 0 6px;color:#8a7058;font-size:12.5px}
.bnav button{width:30px;height:30px;border-radius:10px;background:rgba(90,60,30,.12);color:#5a4630;font-size:18px;line-height:1}
.bnav button:disabled{opacity:.3}
.bcell .rec{position:absolute;right:-7px;top:-7px;z-index:2;background:#ffe27a;color:#7a3b12;font-size:11px;font-weight:700;padding:3px 7px 4px;transform:rotate(7deg);box-shadow:1px 3px 5px rgba(0,0,0,.28);border-radius:1px 1px 1px 6px;pointer-events:none}
.bcell .rec::before{content:"";position:absolute;left:50%;top:-5px;width:18px;height:8px;margin-left:-9px;background:rgba(255,255,255,.55);transform:rotate(-4deg)}
/* 게임 · 방 구석 TV + 게임기 */
.groom{--ct:292px;position:relative;height:var(--stage-h);border-radius:22px;overflow:hidden;isolation:isolate;background:#08080c;color:#eee;box-shadow:0 20px 40px -24px rgba(0,0,0,.7)}
.groom .gwall{position:absolute;left:0;right:0;top:0;height:calc(var(--ct) + 74px);z-index:-3;background:linear-gradient(#111119,#0b0b11)}
.groom .gfloor{position:absolute;left:0;right:0;top:calc(var(--ct) + 74px);bottom:0;z-index:-3;background:linear-gradient(#141218,#09080b)}
.groom .glow{position:absolute;inset:0;z-index:-2;background:radial-gradient(48% 34% at 32% 26%,color-mix(in srgb,var(--g) 50%,transparent),transparent 72%),radial-gradient(60% 22% at 34% 70%,color-mix(in srgb,var(--g) 20%,transparent),transparent 75%);transition:background .6s}
.groom .blinds{position:absolute;right:-4%;top:4%;width:36%;height:34%;z-index:-2;background:repeating-linear-gradient(transparent 0 9px,rgba(170,190,255,.07) 9px 15px);transform:skewY(-8deg)}
.cab2{position:absolute;left:3%;right:3%;top:var(--ct);height:74px;border-radius:3px;background:linear-gradient(#3e3027,#271d16);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 18px 22px -10px rgba(0,0,0,.85)}
.cab2::before{content:"";position:absolute;left:3%;right:3%;top:18px;bottom:10px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);background:linear-gradient(90deg,transparent 49.6%,rgba(0,0,0,.5) 49.6% 50.4%,transparent 50.4%)}
.cab2::after{content:"";position:absolute;left:46%;top:46px;width:8%;height:4px;border-radius:2px;background:#8b7a68;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.tv3{position:absolute;left:6%;width:58%;max-width:300px;bottom:calc(100% - var(--ct));border-radius:7px 7px 3px 3px;padding:12px 12px 34px;background:linear-gradient(180deg,#5a5c60,#46484c 40%,#3a3c40);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.35),inset 2px 0 0 rgba(255,255,255,.06),inset -2px 0 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.6)}
.tv3 .bz{padding:9px;border-radius:5px;background:linear-gradient(#2c2d30,#232427);box-shadow:inset 0 4px 8px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.08),0 1px 0 rgba(255,255,255,.14)}
.tv3 .scr{position:relative;aspect-ratio:4/3;overflow:hidden;background:#050505;border-radius:16px/20px;box-shadow:0 0 22px 2px color-mix(in srgb,var(--g) 45%,transparent)}
.tv3 .scr .pic{position:absolute;inset:-6%;transform:scale(1.04);filter:brightness(1.18) saturate(1.25)}
.tv3 .scr .pic .art{transform:perspective(260px) translateZ(14px)}
.tv3 .scr::before{content:"";position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.tv3 .scr::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;background:radial-gradient(75% 70% at 50% 50%,transparent 58%,rgba(0,0,0,.55) 100%),radial-gradient(60% 45% at 30% 18%,rgba(255,255,255,.26),transparent 60%),linear-gradient(168deg,rgba(255,255,255,.14) 0 30%,transparent 30.5%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 0 26px rgba(0,0,0,.55)}
.tv3 .ttl{position:absolute;left:9%;bottom:9%;z-index:4;font-family:var(--mono);font-size:10px;color:#fff;text-shadow:0 0 6px var(--g),0 0 2px #000}
.tv3 .static{position:absolute;inset:0;z-index:5;opacity:0;background:repeating-radial-gradient(circle at 30% 40%,#fff 0 1px,#555 1px 2px,#000 2px 3px);mix-blend-mode:screen}
.tv3 .static.on{animation:stat .32s steps(4)}
@keyframes stat{0%{opacity:.9}33%{opacity:.7;transform:translate(-3px,2px)}66%{opacity:.5;transform:translate(2px,-1px)}100%{opacity:0}}
.tv3 .pan{position:absolute;left:12px;right:12px;bottom:8px;height:18px;border-radius:2px;background:linear-gradient(#2f3034,#28292c);box-shadow:inset 0 1px 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;gap:3px}
.tv3 .pan i{width:11px;height:6px;border-radius:1px;background:linear-gradient(#55575c,#3a3c40);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.tv3 .pan em{position:absolute;right:8px;width:5px;height:5px;border-radius:50%;background:#ff4a3a;box-shadow:0 0 5px #ff4a3a}
.tv3 .pan s{position:absolute;left:8px;width:22%;height:6px;background:repeating-linear-gradient(90deg,#1a1b1d 0 2px,transparent 2px 4px)}
.vcs{position:absolute;right:4%;width:25%;max-width:150px;top:calc(var(--ct) - 34px);height:34px}
.vcs .top{position:absolute;left:0;right:0;top:6px;height:16px;border-radius:4px 4px 0 0;background:repeating-linear-gradient(180deg,#1b1b1d 0 2px,#2c2c2f 2px 4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.vcs .wood{position:absolute;left:0;right:0;bottom:0;height:12px;border-radius:0 0 2px 2px;background:repeating-linear-gradient(90deg,#6e4422 0 3px,#7d4f2a 3px 7px,#5f3a1c 7px 9px,#86572f 9px 14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 6px rgba(0,0,0,.6)}
.vcs .sw{position:absolute;top:10px;width:5px;height:7px;border-radius:1px;background:linear-gradient(#e6e6e8,#9a9aa0)}
.vcs .cart{position:absolute;left:35%;width:30%;top:-12px;height:20px;border-radius:2px 2px 0 0;background:#1d1d20;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.vcs .cart b{position:absolute;left:12%;right:12%;top:3px;height:10px;border-radius:1px;background:var(--g);transition:background .4s}
.vcs .led{position:absolute;right:7%;top:12px;width:4px;height:4px;border-radius:50%;background:#ff4a3a;box-shadow:0 0 4px #ff4a3a}
.joy{position:absolute;left:65%;top:calc(var(--ct) - 20px);width:22px;height:20px;border-radius:3px;background:#1b1b1d;box-shadow:0 3px 4px rgba(0,0,0,.6)}
.joy::before{content:"";position:absolute;left:8px;top:-14px;width:6px;height:16px;border-radius:3px;background:#111;transform:rotate(-12deg)}
.joy::after{content:"";position:absolute;left:2px;top:2px;width:5px;height:5px;border-radius:50%;background:#c8323c}
.gside{position:absolute;right:4%;top:70px;width:32%;font-size:11.5px;color:#c9c6cf;line-height:1.45}
.gside b{display:block;font-size:15px;color:#fff;line-height:1.3;margin-bottom:3px}
.gside .s{color:var(--star);margin-top:4px}
.gside button{margin-top:10px;padding:6px 11px;border-radius:9px;background:#fff;color:#222;font-size:12px;font-weight:600}
.grow{position:absolute;left:10px;right:10px;bottom:46px;display:flex;align-items:center;gap:6px}
.case2{flex:1;min-width:0;background:linear-gradient(#2c2e33,#1f2024);border-radius:12px;padding:7px;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px;box-shadow:0 14px 24px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.08)}
.garw{flex:none;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.12);color:#fff;font-size:17px;line-height:1}
.garw:disabled{opacity:.25}
.gslot{position:relative;background:#141518;border-radius:7px;padding:4px 4px 3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);perspective:500px}
.gslot.sel{box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 0 0 1.5px color-mix(in srgb,var(--g) 75%,#fff),0 0 14px -2px var(--g)}
.gflip{position:relative;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.gflip.on{transform:rotateY(180deg)}
.gflip>*{backface-visibility:hidden}
.gflip .gbk{position:absolute;inset:0;transform:rotateY(180deg);border-radius:6px;background:linear-gradient(160deg,color-mix(in srgb,var(--d) 75%,#fff),var(--d) 45%,color-mix(in srgb,var(--d) 70%,#000));padding:9%;container-type:inline-size;display:flex;flex-direction:column;justify-content:space-between;color:#fff;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.gbk b{font-size:14cqw;line-height:1.2;display:block}
.gbk .m{font-size:9.5cqw;opacity:.8;font-family:var(--mono);display:block}
.gbk .s{color:var(--star);font-size:11cqw}
.gempty{aspect-ratio:44/52;border:1.5px dashed #3a3d44;border-radius:5px;margin:4px}
.gpg{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--mono);font-size:11px;color:#8f8c96}
/* 목표 · 게임 카드 그리드 */
.slot.goal{border:1.5px dashed #4a4d55;background:transparent;box-shadow:none;display:grid;place-items:center;color:#6b6f78;font-size:18px;min-height:80px}
.slot.ph{visibility:hidden}
/* 목표 · 영화 포스터 액자 벽 */
.wall{position:relative;border-radius:16px;padding:34px 14px 34px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 22px,color-mix(in srgb,var(--surface-2) 93%,var(--fg)) 22px 23px);box-shadow:inset 0 -16px 0 color-mix(in srgb,var(--wood) 75%,transparent),inset 0 -18px 0 var(--woodd)}
.wrow{display:flex;gap:14px;align-items:center;justify-content:center}
.wrow+.wrow{margin-top:40px}
.fr{position:relative;min-width:0;background:var(--fc);padding:5px;border-radius:2px;box-shadow:0 12px 16px -8px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.14)}
.fr .mat{background:#f7f4ee;padding:10%;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}

#amb.on{opacity:1}
#amb .ai{position:absolute;inset:0}
#amb svg,#amb img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(70px) brightness(.32) saturate(1.25)}
.fitw{position:relative;margin:0 auto}
.slots.gsm{grid-template-columns:repeat(auto-fill,minmax(58px,68px))!important;justify-content:start}
.slots.gsm .slot{padding:6px 6px 4px;border-radius:9px}
.slots.gsm .slot.goal{min-height:72px}
.gmon{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.gm{display:flex;gap:12px;align-items:center}
.gm .slot{width:68px;flex:none;padding:6px 6px 4px;border-radius:9px}
.gm .slot.goal{min-height:72px}
.gm .gi{display:flex;flex-direction:column;gap:1px;font-size:12px;color:#a9adb7;min-width:0}
.gm .gi b{color:#fff;font-size:14px}
.gm .gi .s{color:var(--star);font-size:12px}
.gm .gi .stz svg{width:1em!important;height:1em!important}
.gm .slot .gcard{width:100%}
@media (min-width:1000px){
  .app{display:grid;grid-template-columns:220px minmax(0,1fr);column-gap:40px;padding:28px 40px 60px}
  .side{position:sticky;top:28px;align-self:start}
  .side .top{flex-wrap:wrap;row-gap:12px}
  .side .top h1{font-size:30px}
  .side .chips{flex-direction:column;gap:6px;overflow:visible;margin-bottom:18px}
  .side .chip{width:100%;padding:9px 14px;border-radius:12px;font-size:14.5px}
  .side .seg{flex-direction:column;gap:2px}
  .side .seg button{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;text-align:left}
  #main.v-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px;align-items:start}
  #main.v-stats .sbox{margin:0}
  #main.v-stats>.wrapc,#main.v-stats>.sharebtn,#main.v-stats>.hint{grid-column:1/-1}
  #main.v-cal .cal{max-width:980px;margin:0 auto}
  #main.v-cal .hint{max-width:980px;margin:10px auto 0}
  #main.v-grid .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
  .mainc .note{text-align:left}
}

body.zblue{background:radial-gradient(circle,rgba(255,255,255,.06) 0 1px,transparent 1.4px) 0 0/6px 6px,radial-gradient(90% 70% at 40% 20%,#2a4ce6,#1832b8 85%) fixed;--muted:rgba(245,240,218,.72);--fg:#f5f0da}

/* 영화 상세 페이지 (빨간 종이 · 큰 제목 · 영수증 · 펀칭된 스틸컷) */
#mvd{position:fixed;inset:0;z-index:1000;background:#F84146;color:#1b1b1b;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .25s,visibility 0s .25s;font-family:"IBM Plex Mono","Nanum Gothic Coding",monospace;color-scheme:light}
#mvd.on{visibility:visible;opacity:1;transition:opacity .25s}
#mvd::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .2  0 0 0 0 .2  0 0 0 .7 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
/* 화면 오른쪽에 붙임: 창이 넓어지면 왼쪽이 비어요 */
#mvd .cv{position:absolute;right:0;top:50%;width:1600px;height:1530px;transform-origin:100% 50%;transform:translateY(-50%) scale(var(--s,1))}
#mvd .pg{position:absolute;left:0;right:0;top:250px;height:1000px}
#mvd .mono{font-family:"IBM Plex Mono","Nanum Gothic Coding",monospace;font-weight:500;font-size:17px;letter-spacing:.4px;line-height:1.45}
#mvd [contenteditable]{outline:none;border-radius:2px;cursor:text}
#mvd [contenteditable]:hover{background:rgba(0,0,0,.05)}
#mvd [contenteditable]:focus{background:rgba(0,0,0,.07)}
#mvd [contenteditable]:empty::before{content:attr(data-ph);opacity:.45}
#mvd .fecha{position:absolute;right:64px;top:34px;display:flex;align-items:baseline;gap:12px}
#mvd .fecha .hw{position:relative;font:inherit;color:#1b1b1b;cursor:pointer}
#mvd .fecha input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
#mvd .lc{position:absolute;right:1000px;left:250px;top:96px;text-align:right}
#mvd .lc .no{display:block}
#mvd .st{display:inline-flex;gap:6px;margin:30px 0 0;cursor:pointer}
#mvd .st svg{width:40px;height:40px;overflow:visible}

#mvd .rv{position:absolute;left:820px;width:540px;top:500px;text-align:right}

#mvd .rv .lb{position:absolute;left:100%;top:0;margin-left:66px;white-space:nowrap}

#mvd .rc{position:absolute;left:70px;top:388px;width:384px;transform:rotate(-5deg) scale(.86);transform-origin:0 0}
#mvd .rc .rcp{filter:drop-shadow(1.7px 0 0 #141414) drop-shadow(-1.7px 0 0 #141414) drop-shadow(0 1.7px 0 #141414) drop-shadow(0 -1.7px 0 #141414) drop-shadow(1px 2px 0 rgba(0,0,0,.16)) drop-shadow(0 8px 10px rgba(80,0,0,.18))}
#mvd .rc .ppr{position:relative;background:#f4f3ef;padding:34px 26px 30px;color:#161616;font:500 14.5px/1.42 "IBM Plex Mono","Nanum Gothic Coding",monospace;letter-spacing:.2px;clip-path:polygon(var(--zz));text-shadow:0 0 .4px rgba(0,0,0,.6)}
#mvd .rc .ppr::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;background:radial-gradient(circle at 75% 20%,transparent 45%,rgba(110,100,90,.14)),radial-gradient(circle at 20% 85%,transparent 50%,rgba(110,100,90,.1))}

  const ov=document.createElement('div');ov.className='fly';ov.innerHTML=from.innerHTML;Object.assign(ov.style,{left:s.left+'px',top:s.top+'px',width:s.width+'px'});$('#po').appendChild(ov);
  const a1=v.animate(K.map(k=>({transform:tf(k,t),...off(k)})),{duration:dur,easing:ease,fill:open?'none':'forwards'});
  ov.animate(K.map(k=>({transform:tf(k,s),...off(k)})),{duration:dur,easing:ease,fill:'forwards'});
  ov.animate({opacity:open?[1,0]:[0,1]},{duration:dur*.32,delay:open?0:dur*.68,fill:'both',easing:'linear'});
  return a1.finished.then(()=>ov)}

const UNIT={m:'편',g:'개',b:'권',u:'장',all:'개'};
const GOAL={year:{all:50,m:24,g:8,b:14,u:20},month:{all:8,m:4,g:1,b:2,u:3}};

function goalPace(list,goal,frac,tf){
  const X0=24,X1=306,YB=140,top=Math.max(goal,list.length),Y=v=>YB-v/top*118,X=f=>X0+f*(X1-X0);
  let d=`M${X0} ${YB}`,c=0;list.forEach(it=>{const x=X(frac(it.date));d+=` L${x.toFixed(1)} ${Y(c).toFixed(1)}`;c++;d+=` L${x.toFixed(1)} ${Y(c).toFixed(1)}`});
  d+=` L${X(tf).toFixed(1)} ${Y(c).toFixed(1)}`;
  const ticks=S.gp=='year'?[[0,'1월'],[90/365,'4월'],[181/365,'7월'],[273/365,'10월']]:[[0,'1일'],[7/31,'8일'],[14/31,'15일'],[21/31,'22일'],[28/31,'29일']];
  return `<svg viewBox="0 0 320 160"><line x1="${X0}" x2="${X1}" y1="${YB}" y2="${YB}" stroke="var(--line)"/><line x1="${X0}" y1="${YB}" x2="${X1}" y2="${Y(goal).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="4 3"/><text x="${X1}" y="${(Y(goal)-6).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">목표 ${goal}</text><line x1="${X(tf).toFixed(1)}" x2="${X(tf).toFixed(1)}" y1="14" y2="${YB}" stroke="var(--line)"/><path d="${d}" fill="none" stroke="var(--accent-strong)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${X(tf).toFixed(1)}" cy="${Y(c).toFixed(1)}" r="5" fill="var(--accent-strong)"/>${ticks.map(t=>`<text x="${X(t[0]).toFixed(1)}" y="156" font-size="10.5" fill="var(--muted)">${t[1]}</text>`).join('')}</svg>`}

function goalList(cat,gp){const pre=gp=='year'?'2026':'2026-10';return items.filter(i=>i.status=='done'&&i.date.startsWith(pre)&&(cat=='all'||i.cat==cat)).sort((a,b)=>a.date.localeCompare(b.date))}
function goalHead(cat){const gp=S.gp,goal=GOAL[gp][cat],L=goalList(cat,gp),tf=gp=='year'?doy(TODAY)/365:18/31,u=UNIT[cat];
  const diff=Math.round(L.length-goal*tf),txt=L.length>=goal?'목표 달성!':diff>0?`예정보다 ${diff}${u} 앞섬`:diff<0?`예정보다 ${-diff}${u} 늦음`:'예정대로';

/* 책: 월간(세우고·기대고·눕힌 책장) ↔ 연간(높이 비교 눈금자). 같은 책이 자리를 옮겨요 */

  box.innerHTML=h;layoutBooks(box)}
function layoutBooks(box){
  const W=box.clientWidth||320,gp=S.gp,yr=goalList('b','year'),mon=goalList('b','month'),rd=reading(),T=it=>bThick(it)*PXCM,q=s=>box.querySelector(s);

  const totcm=yr.reduce((s,i)=>s+bThick(i),0),avg=yr.length?totcm/yr.length:1.6,goalcm=avg*GOAL.year.b,maxcm=Math.max(30,Math.ceil(Math.max(totcm,goalcm)/5)*5+3),YB=maxcm*PXCM+14,cx=96;
  let acc=0;yr.forEach(it=>{const t=T(it);const Q=at(it,cx+((it.id*13)%9-4),YB-acc-t/2,90+((it.id*7)%5-2)*.9);Q.y=1;acc+=t});
  // 월간: 세우기 · 기대기 · 눕히기
  const MB=112;let x=18;const M={};
  mon.forEach((it,k)=>{const t=T(it),l=bLen(it);
    if(k==mon.length-1&&mon.length>=2){const th=16*Math.PI/180,c=Math.cos(th),s=Math.sin(th),x0=x+l*s-1;M[it.id]={cx:x0+t/2*c-l/2*s,cy:MB-(t/2*s+l/2*c),r:-16};x=x0+t*c+8}
    else{M[it.id]={cx:x+t/2,cy:MB-l/2,r:0};x+=t+2}});
  const need=Math.max(0,GOAL.month.b-mon.length);let ex=x+4;
  x=x+4+need*20+14;let st=0;rd.forEach(it=>{const t=T(it),l=bLen(it);M[it.id]={cx:x+l/2,cy:MB-st-t/2,r:90};st+=t});
  const all=[...yr,...rd];
  all.forEach((it,k)=>{const e=q(`[data-sid="${it.id}"]`),t=T(it),l=bLen(it);

function renderCD(l,head){S._cdl=l;const n=Math.max(l.length,64);S.cdo=((S.cdo||0)%l.length+l.length)%l.length;if(S.cdk==null||S.cdk>=n)S.cdk=6;

/* 음악 상세: 누르면 CD 줄이 위로 사라지고, 펼친 CD 케이스 목업(Free CD Jewel Case Mockup 4)이 위에서 내려옴.
   목업은 PSD의 고정 레이어를 미리 구워 두고, 그림 들어가는 자리(속지 · 트레이 속지 · 옆면 · CD 라벨)만 matrix3d로 원근을 맞춰 끼움 */
const MK={"W": 1380, "H": 1212, "art": [838.25, 453.03, 1329.31, 715.4, 1030.46, 1031.07, 520.03, 721.94], "side": [1030.79, 1034.33, 1032.13, 1014.43, 1327.14, 703.89, 1325.42, 721.45], "bc": [485.91, 65.21, 821.51, 436.19, 507.68, 703.49, 154.25, 294.54], "cd": [314.56, 654.66, 723.0, 904.78, 357.94, 1244.67, -72.05, 972.24], "ox": -115.8, "oy": -402.0, "op": [230, 179, 64, 204]},MKI={basec:'img/3adb80a80dc0e4e3.webp',pmask:'img/53b14bc1e8871f49.webp',psh:'img/ff51d73af333df01.webp',pli:'img/63746829a52b3a81.webp',paper:'img/2627ad4c114744e7.webp',label:'img/f7027144ac6de8d9.webp',hlc:'img/d2730c2aad496f2e.webp',hld:'img/2faab63391266f12.webp',dsh:'img/420b4600d1cf402b.webp',dbase:'img/2f5c69e9495eb413.webp'};
function q3d(w,h,q){const[x0,y0,x1,y1,x2,y2,x3,y3]=q,dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dx2*dy1,
  g=(dx3*dy2-dx2*dy3)/den,k=(dx1*dy3-dx3*dy1)/den,a=x1-x0+g*x1,b=x3-x0+k*x3,d=y1-y0+g*y1,e=y3-y0+k*y3;
  return `matrix3d(${a/w},${d/w},0,${g/w},${b/h},${e/h},0,${k/h},0,0,1,0,${x0},${y0},0,1)`}
/* 그림을 자리보다 살짝 크게 펴서(e배) 종이·라벨 마스크 가장자리에 흰 틈이 안 남게 함. 바깥은 마스크가 잘라 냄 */
function qGrow(q,e){const cx=(q[0]+q[2]+q[4]+q[6])/4,cy=(q[1]+q[3]+q[5]+q[7])/4;return q.map((v,i)=>i%2?cy+(v-cy)*e:cx+(v-cx)*e)}
function mkQ(q,w,h,cls,inner,e){return `<div class="mkq ${cls}" style="width:${w}px;height:${h}px;transform:${q3d(w,h,e?qGrow(q,e):q)}">${inner}</div>`}
function mockH(it){ensureTL(it);const g=it.meta.split(' · ');
  const inlay=`<div class="mkin"><b>${it.title}</b><i>${g[2]||''}</i><ol>${it.tl.map(t=>`<li><span>${t.n}</span><em>${Math.floor(t.s/60)}:${String(t.s%60).padStart(2,'0')}</em></li>`).join('')}</ol><u>${g[0]}</u></div>`;
  const ks=innerWidth*.6/1384;   /* 1384 = 화면에 보이는 잘린 폭(0.6배 기준). 목업 자체는 잘리지 않은 전체 크기, 화면에서만 왼쪽 위로 밀어 잘라 보임 */
  return `<div class="mku" style="${vars(it)};width:${MK.W}px;height:${MK.H}px;left:${(MK.ox*ks).toFixed(1)}px;top:${(MK.oy*ks).toFixed(1)}px;transform:scale(${ks.toFixed(4)})">
   <div class="mkg mkcase"><img src="${MKI.basec}" alt="">
   <div class="mkm" style="-webkit-mask-image:url(${MKI.pmask});mask-image:url(${MKI.pmask})">${mkQ(MK.art,470,399,'mkart',inlay,1.03)}</div>
   ${mkQ(MK.side,24,399,'mkside',`<span>${it.title}</span>`)}
   <img src="${MKI.psh}" alt=""><img src="${MKI.pli}" alt="">
   <div class="mkm" style="-webkit-mask-image:url(${MKI.paper});mask-image:url(${MKI.paper})"><img src="${MKI.paper}" alt="">${mkQ(MK.bc,400,400,'mkx',acoverH(it),1.04)}</div>
   <img src="${MKI.hlc}" alt=""></div>
   <img class="mkdsh" src="${MKI.dsh}" alt="">
   <div class="mkg mkdisc"><img src="${MKI.dbase}" alt=""><div class="mkm" style="-webkit-mask-image:url(${MKI.label});mask-image:url(${MKI.label})"><img src="${MKI.label}" alt="">${mkQ(MK.cd,400,400,'mkx',acoverH(it),1.04)}</div>
   <img src="${MKI.hld}" alt=""></div></div>`}
const MKE='cubic-bezier(.7,0,.84,0)',MKO='cubic-bezier(.16,1,.3,1)';
/* 펼친 케이스 → 원판 → 글씨 순서로 시간차를 두고 떨어져 내려옴 */
function cddParts(po){const k=parseFloat((po.querySelector('.mku').style.transform.match(/scale\(([\d.]+)/)||[0,1])[1]),dy=innerHeight/k+MK.H;
  return [[po.querySelector('.mkcase'),dy,0],[po.querySelector('.mkdsh'),0,1],[po.querySelector('.mkdisc'),dy,1],[po.querySelector('.po-r'),innerHeight,2],[po.querySelector('.po-x'),innerHeight,2]]}
function openCDD(it){S.usel=it.id;openPO(it,null);const po=$('#po');po.classList.add('cdo');po.querySelector('.po-l').innerHTML=mockH(it);po.scrollTop=0;
  document.body.classList.add('cdopen');const T=cdWave($('.cdscene'),true),t0=Math.max(120,T-260);
  cddParts(po).forEach(([e,dy,i])=>e&&e.animate(dy?[{transform:`translateY(${-dy}px)`},{transform:'none'}]:[{opacity:0},{opacity:1}],{duration:dy?560:260,delay:t0+i*110+(dy?0:260),easing:MKO,fill:'backwards'}))}
/* CD 줄 물결: 앞쪽 끝부터 한 장씩 매끄럽게 올라가고, 닫을 땐 같은 순서로 내려와 멈춤 */
function cdWave(sc,up){if(!sc)return 0;const vw=innerWidth,vh=innerHeight;let n=0;
  [...sc.querySelectorAll('.cdc')].sort((a,b)=>a.dataset.cdk-b.dataset.cdk).forEach(c=>{c.getAnimations().forEach(a=>a.cancel());const r=c.getBoundingClientRect(),z=c.style.getPropertyValue('--z')||'0px',Z=`translateZ(${z})`,
    vis=r.right>0&&r.bottom>0&&r.left<vw&&r.top<vh,dl=vis?n++*25:0;
    const K=up?[{transform:Z},{transform:Z+' translateY(-1600px)'}]:[{transform:Z+' translateY(-1600px)'},{transform:Z}];
    c.animate(K,{duration:vis?(up?380:420):1,delay:vis?dl:0,easing:up?'cubic-bezier(.7,0,.84,0)':'cubic-bezier(.2,.75,.25,1)',fill:up?'forwards':'backwards'})});
  return (n-1)*25+(up?380:420)}
function closeCDD(after){const po=$('#po');if(after)after();po.className='on cdo closing2';document.body.classList.remove('cdopen');
  const A=cddParts(po).map(([e,dy,i])=>e&&e.animate(dy?[{transform:'none'},{transform:`translateY(${-dy}px)`}]:[{opacity:1},{opacity:0}],{duration:dy?340:200,delay:(2-i)*70,easing:MKE,fill:'forwards'})).filter(Boolean);
  Promise.all(A.map(a=>a.finished)).then(()=>{po.className='';po.innerHTML='';document.body.classList.remove('lock')});
  setTimeout(()=>cdWave($('.cdscene'),false),200)}
/* 누르면 골라져서 튀어나오고(가장자리면 줄을 밀어 가운데로), 튀어나온 케이스를 한 번 더 누르면 열기 */
function cdClick(t){const vw=innerWidth,vh=innerHeight,r=t.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,k=+t.dataset.cdk;
  if(k==S.cdk)return openCDD(items.find(i=>i.id==+t.dataset.cd));
  if(cx>vw*.18&&cx<vw*.82&&cy>vh*.15&&cy<vh*.85){S.cdk=k;S.usel=+t.dataset.cd;document.querySelectorAll('.cdc').forEach(e=>e.classList.toggle('on',+e.dataset.cdk==k));return cdInfo()}
  const cs=[...document.querySelectorAll('.cdc')].sort((a,b)=>a.dataset.cdk-b.dataset.cdk),vis=cs.filter(c=>{const q=c.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;return x>0&&y>0&&x<vw&&y<vh}).map(c=>+c.dataset.cdk);
  const kc=Math.round((Math.min(...vis)+Math.max(...vis))/2),sh=k-kc;if(!sh)return;
  const l=S._cdl,n=cs.length,zo=cs.map(c=>parseFloat(c.style.getPropertyValue('--z'))||0);
  S.cdo=(((S.cdo||0)+sh)%l.length+l.length)%l.length;S.cdk=kc;
  /* 다시 그리지 않고 있던 케이스를 그대로 옮겨 씀: 새 자리 j에는 원래 j+sh에 있던 케이스, 줄 끝에서 비는 자리만 새로 만듦 */
  const L=[...Array(n)].map((_,k)=>l[(k+S.cdo)%l.length]);let z=0,pd=0;const zs=L.map((it,k)=>{const d=isTape(it)?118:14;if(k)z-=pd/2+d/2+40;pd=d;return z});
  const row=$('.cdrow'),tmp=document.createElement('div'),keep=new Set();document.body.classList.add('cdmv');
  const els=L.map((it,j)=>{const o=j+sh;let e;if(o>=0&&o<n){e=cs[o];keep.add(e)}else{tmp.innerHTML=cdH(it,j,zs[j]);e=tmp.firstElementChild}
    e.dataset.cdk=j;e.style.setProperty('--i',j);e.style.setProperty('--z',zs[j]+'px');return e});
  cs.forEach(c=>{if(!keep.has(c))c.remove()});els.forEach(e=>{if(!e.isConnected)row.appendChild(e)});
  /* 줄 전체를 한 덩어리로 밀기: 남은 케이스는 모두 같은 거리(D)만큼 움직이므로 줄(.cdrow) 하나만 애니메이션 → 겹침 없음, 프레임 가벼움 */
  els.forEach((e,j)=>e.classList.toggle('on',j==kc));
  const j0=Math.max(0,-sh),D=zo[j0+sh]-zs[j0],rw=row.getAnimations();rw.forEach(a=>a.cancel());
  const bt=getComputedStyle(row).transform;row.style.willChange='transform';
  row.animate([{transform:`${bt} translateZ(${D}px)`},{transform:`${bt} translateZ(0px)`}],{duration:520,easing:'cubic-bezier(.3,.7,.2,1)'}).finished.then(()=>row.style.willChange='',()=>0);
  S.usel=L[kc].id;cdInfo();setTimeout(()=>document.body.classList.remove('cdmv'),560)}

/* ── 미리보기에서 영화 상세(영수증·사진·위치·회차) 저장: 이 기기 IndexedDB 'girok-mvd'. 앱(GIROK_APP)은 items 통째 저장이 따로 있어서 건너뜀 ── */
const MVS={db:null,last:{},seen:new Set()};
function mvsDb(){return MVS.db||(MVS.db=new Promise((ok,no)=>{const r=indexedDB.open('girok-mvd',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
function mvsSave(){if(window.GIROK_APP||!MVS.seen.size)return;const ch={};for(const id of MVS.seen){const it=items.find(i=>i.id==id);if(!it)continue;let s;try{s=JSON.stringify(it)}catch(e){continue}if(s!==MVS.last[id]){MVS.last[id]=s;ch[id]=s}}
  if(!Object.keys(ch).length)return;mvsDb().then(db=>{const t=db.transaction('kv','readwrite'),st=t.objectStore('kv');for(const k in ch)st.put(ch[k],'m'+k)}).catch(()=>{})}
function mvsLoad(){if(window.GIROK_APP)return;mvsDb().then(db=>new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').openCursor(),got=[];q.onsuccess=()=>{const c=q.result;if(c){got.push([c.key,c.value]);c.continue()}else ok(got)};q.onerror=()=>ok(got)})).then(got=>{if(window.GIROK_APP||!got.length)return;
  for(const[k,s] of got){let v;try{v=JSON.parse(s)}catch(e){continue}const it=items.find(i=>i.id==v.id);if(it)Object.assign(it,v);else items.push(v);MVS.last[v.id]=s;MVS.seen.add(+v.id)}
  try{render()}catch(e){}if(document.getElementById('mvd')?.classList.contains('on'))mvdRender()}).catch(()=>{})}
setTimeout(mvsLoad,0);setInterval(()=>{if(MVD.id!=null)MVS.seen.add(MVD.id);mvsSave()},2000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden'){if(MVD.id!=null)MVS.seen.add(MVD.id);mvsSave()}});
addEventListener('pagehide',()=>{if(MVD.id!=null)MVS.seen.add(MVD.id);mvsSave()});

function gmHex(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255)}
function gmRisoLut(R){if(R._lut)return R._lut;const P=gmHex(R.paper),I=R.inks.map(k=>gmHex(k.c)),n=I.length,Q=24,L=new Float32Array(Q*Q*Q*n);

    const c=new Array(n).fill(.3);for(let it=0;it<60;it++)for(let k=0;k<n;k++){let e=0,dd=0;for(let j=0;j<3;j++){let s=0;for(let m=0;m<n;m++)s+=c[m]*d[m][j];e+=(s-t[j])*d[k][j];dd+=d[k][j]*d[k][j]}

function gmRiso(src0,R){R=R||GM_RISO;const src=document.createElement('canvas');src.width=src0.width;src.height=src0.height;{const q=src.getContext('2d');q.filter='brightness(1.12) saturate(1.25) contrast(1.05)';q.drawImage(src0,0,0)}const W=src.width,H=src.height,sd=src.getContext('2d').getImageData(0,0,W,H).data,L=gmRisoLut(R),n=R.inks.length,Q=24;

    return mk('m',d.title,[d.year,d.genre||(d.tv?'드라마':'영화'),d.mins?d.mins+'분':''].filter(Boolean).join(' · '),'want',0,T,{img:p?.src,c:p?.c||PAL[0],en:d.en!=d.title?d.en:'',dir:d.dir,plot:d.plot,logo:lg?.src||'',mins:d.mins||110,stillUrl:(d.stills||[])[0]||'',src:{tmdb:id},langV:1})}
  if(cat=='u'){const p=await wkImg(d.img,900).catch(()=>null),n=d.tracks.length;
    const it=mk('u',d.title,[d.year,d.genre,d.artist,n+'곡'].filter(Boolean).join(' · '),'want',0,T,{cimg:p?.src,c:p?.c||PAL[0],tracks:n,mins:Math.round(d.tracks.reduce((a,t)=>a+t.s,0)/60),credits:d.credits,src:String(id).startsWith('dz:')?{deezer:id.slice(3)}:{itunes:id}});
    it.tl=d.tracks.map(t=>({n:t.n,s:t.s}));it.heard=[];it.fav=-1;return it}
  if(cat=='b'){const p=await wkBookImg(d);
    return mk('b',d.title,[d.year,d.authors,d.publisher].filter(Boolean).join(' · '),'want',0,T,{img:p?.src,c:p?.c||PAL[0],plot:d.plot,pages:d.pages||0,...wkBookInfo(d),src:{isbn:id}})}
  if(cat=='g'){const [p,s,lg]=await Promise.all([wkImg(d.img,600).catch(()=>null),d.shots[0]?wkImg(d.shots[0],960,.82).catch(()=>null):null,d.logo?wkImg(d.logo,700).catch(()=>null):null]);
    const pf=wkPf(d.platforms);
    return mk('g',d.title,[d.year.slice(0,4),d.genre,pf.n].filter(Boolean).join(' · '),'want',0,T,{cimg:p?.src,shotSrc:s?.src,c:p?.c||PAL[0],genre:d.genre,dev:d.dev,rel:d.year,pf:pf.k,pfn:pf.n,est:d.est||0,plot:d.plot,logo:lg?.src||'',logoTried:1,...(d.steam?{steam:d.steam}:{}),src:{igdb:id},...hint})}}
function wkPf(l=[]){const a=l.join(' ');if(/PS5|PS4|PS3|PSV|PSP/.test(a)&&!/PC/.test(a))return {k:'ps',n:l.find(x=>/PS/.test(x))};if(/Switch|NSW/.test(a)&&!/PC/.test(a))return {k:'sw',n:'Switch'};if(/PC/.test(a))return {k:'pc',n:'PC'};return {k:'ps',n:l[0]||''}}

/* ---------- 플랫 시트 ---------- (attr 안에 class 가 있으면 그게 먼저라서 이김) */
const _openSheetW=openSheet;
openSheet=function(html){$('#sheet').classList.remove('wkf');document.body.classList.remove('wkfon');return _openSheetW(html)};
function wkSheet(ko,en,body){_openSheetW(`<div class="wkhd"><h2>${ko}<small>${en}</small></h2><button class="wkxb" data-closes aria-label="닫기">×</button></div>${body}`);$('#sheet').classList.add('wkf');document.body.classList.add('wkfon')}
const wkRow=(attr,thumb,title,meta,sq,extra='')=>`<button ${attr} class="wkr"><span class="wkth${sq?' sq':''}">${thumb?`<img src="${wkEsc(thumb)}" alt="" loading="lazy">`:''}</span><span class="wkrt"><b>${wkEsc(title)}</b><small>${meta}</small></span>${extra}</button>`;

/* ---------- 작품 추가 (실제 검색) ---------- */
const _wkSearch0=search;
const WKS={cat:'m',q:'',t:0,seq:0,by:'album',art:null};
const WK_CATS=[['m','영화·드라마','movie'],['g','게임','game'],['b','책','book'],['u','음악','music']];
const WK_SRC={m:'TMDB',g:'IGDB',b:'Kakao',u:'Apple iTunes · Deezer · Discogs'};
search=function(){if(!wkOn())return _wkSearch0();
  const fixed=['m','g','b','u'].includes(OV.cat);if(fixed)WKS.cat=OV.cat;const C=WK_CATS.find(c=>c[0]==WKS.cat);
  wkSheet(fixed?C[1]+' 추가':'작품 추가',fixed?'add '+C[2]:'add work',`${fixed?'':`<div class="wkseg" id="scats">${WK_CATS.map(([k,n,e])=>`<button class="${WKS.cat==k?'on':''}" data-wkc="${k}">${n}<small>${e}</small></button>`).join('')}</div>`}
  ${WKS.cat=='u'?`<div class="wkseg wkby" id="wkby">${[['album','앨범','album'],['artist','가수','artist']].map(([k,n,e])=>`<button class="${WKS.by==k?'on':''}" data-wkby="${k}">${n}<small>${e}</small></button>`).join('')}</div>`:''}
  <label class="wkin"><small>검색 search</small><input id="q" placeholder="${WKS.cat=='u'&&WKS.by=='artist'?'가수 이름으로 찾기':'제목으로 찾기'}" autocomplete="off" value="${wkEsc(WKS.q)}"></label>
  <div class="wkres" id="res"></div>
  <p class="wkft"><span>정보 source</span><span>${WK_SRC[WKS.cat]}</span></p>`);
  const q=$('#q');q.oninput=()=>{WKS.q=q.value;WKS.art=null;clearTimeout(WKS.t);WKS.t=setTimeout(wkFind,320)};
  if($('#wkby'))$('#wkby').onclick=e=>{const b=e.target.closest('[data-wkby]');if(!b||b.dataset.wkby==WKS.by)return;WKS.by=b.dataset.wkby;WKS.art=null;search()};
  if($('#scats'))$('#scats').onclick=e=>{const b=e.target.closest('[data-wkc]');if(!b)return;WKS.cat=b.dataset.wkc;search()};
  $('#res').onclick=e=>{const a=e.target.closest('[data-wkar]');if(a){WKS.art={id:a.dataset.wkar,name:a.dataset.wkan};wkFind();return}
    if(e.target.closest('[data-wkback]')){WKS.art=null;wkFind();return}
    const b=e.target.closest('[data-wkp]');if(b)wkPick(b.dataset.wkp,b)};
  wkFind();setTimeout(()=>q.focus(),60)};
async function wkFind(){const res=$('#res');if(!res)return;const q=WKS.q.trim(),n=++WKS.seq;
  if(!q){res.innerHTML='';return}
  res.innerHTML='<div class="wkm">찾는 중…</div>';
  if(WKS.cat=='u'&&WKS.by=='artist')return wkFindArtist(q,n);
  try{const r=await wk({a:'search',cat:WKS.cat,q});if(n!=WKS.seq)return;
    res.innerHTML=r.items.map(x=>wkRow(`data-wkp="${wkEsc(x.id)}"`,x.thumb,x.title,[x.year,x.sub].filter(Boolean).map(wkEsc).join(' · '),WKS.cat=='u')).join('')||'<div class="wkm">찾는 작품이 없어요</div>'}
  catch(e){if(n==WKS.seq)res.innerHTML=`<div class="wkm">${wkEsc(WK_MSG(e))}</div>`}}
// 음악 '가수'로 찾기: 가수 목록 → 고르면 그 가수 앨범 (정규 먼저, 새것부터)
async function wkFindArtist(q,n){const res=$('#res');
  try{
    if(WKS.art){const r=await wk({a:'artist',id:WKS.art.id});if(n!=WKS.seq)return;
      res.innerHTML=`<button class="wkr wkback" data-wkback><span class="wkrt"><b>‹ ${wkEsc(WKS.art.name)}</b><small>다른 가수 고르기 · 앨범 ${r.items.length}개</small></span></button>`+(r.items.map(x=>wkRow(`data-wkp="${wkEsc(x.id)}"`,x.thumb,x.title,[x.year,x.sub].filter(Boolean).map(wkEsc).join(' · '),true)).join('')||'<div class="wkm">앨범이 없어요</div>');return}
    const r=await wk({a:'search',cat:'u',by:'artist',q});if(n!=WKS.seq)return;
    res.innerHTML=r.items.map(x=>wkRow(`data-wkar="${wkEsc(x.id)}" data-wkan="${wkEsc(x.title)}"`,x.thumb,x.title,wkEsc(['가수',x.sub].filter(Boolean).join(' · ')),true)).join('')||'<div class="wkm">찾는 가수가 없어요</div>'}
  catch(e){if(n==WKS.seq)res.innerHTML=`<div class="wkm">${wkEsc(WK_MSG(e))}</div>`}}
async function wkPick(id,b){if(WKS.busy)return;WKS.busy=true;b.classList.add('wkld');
  try{const it=await wkMake(WKS.cat,id);closeSheet();openPO(it,null,true);if(it.cat=='u')wkAutoVinyl(it.id,it)}
  catch(e){toast(WK_MSG(e))}finally{WKS.busy=false;b.classList.remove('wkld')}}

/* ---------- 바이닐 (Discogs): 알아서 찾아 붙이기 ---------- */
const artistOfW=it=>it.meta.split(' · ')[2]||'';
const wkNorm=s=>String(s||'').toLowerCase().normalize('NFKC').replace(/\(.*?\)|\[.*?\]/g,' ').replace(/^the\s+/,'').replace(/[^a-z0-9가-힣ぁ-ゟ゠-ヿ一-鿿]/g,'');
/* 'Artist - Title' 이 이 앨범이 맞는지 (가수·제목 둘 다 들어 있어야) */
function wkSame(it,x){const [a,...t]=String(x.title).split(' - '),A=wkNorm(artistOfW(it)),T=wkNorm(it.title),ra=wkNorm(a),rt=wkNorm(t.join(' - '));
  if(!A||!T||!ra||!rt)return false;return (ra.includes(A)||A.includes(ra))&&(rt.includes(T)||T.includes(rt))}
async function wkFindVinyl(it){const r=await wk({a:'vinyl',artist:artistOfW(it),title:it.title});
  const ok=r.items.filter(x=>wkSame(it,x));if(!ok.length)return null;
  const y=+it.meta.slice(0,4);return ok.find(x=>+x.year==y&&/LP/.test(x.format))||ok.find(x=>+x.year==y)||ok.find(x=>/LP/.test(x.format))||ok[0]}
async function wkVinylFrom(id,fi,di){const r=await wk({a:'vimages',id});const im=r.images;if(!im.length)return null;
  fi=fi??Math.max(0,im.findIndex(i=>i.primary));const f=await wkImg(im[fi].src,720);
  if(di==null){/* 판 사진은 앞면 말고 몇 장 중에서 LP판처럼 생긴 것 */
    let best=-1,bs=.5;for(let k=0;k<Math.min(im.length,7);k++){if(k==fi)continue;try{const g=await wkBlob(im[k].src,240),s=wkDiscScore(g.x,g.w,g.h);if(s>bs){bs=s;best=k}}catch(e){}}
    di=best}
  const d=di>=0?await wkImg(im[di].src,720).catch(()=>null):null;
  return {id:r.id,title:r.title,year:r.year,country:r.country,label:r.label,url:r.url,front:f.src,disc:d?.src||'',fi,di:d?di:-1,c:f.c}}
/* 새로 넣은 앨범·바이닐 없는 앨범: 뒤에서 하나씩 (Discogs 1분 60번 제한) */
const WKQ={q:[],run:false};
function wkAutoVinyl(id,draft){if(!WKQ.q.some(x=>x.id==id))WKQ.q[draft?'unshift':'push']({id,draft});wkRunQ()}
async function wkRunQ(){if(WKQ.run)return;WKQ.run=true;
  try{while(WKQ.q.length){const {id,draft}=WKQ.q.shift();
    const src=items.find(i=>i.id==id)||draft;if(!src||src.vinyl||src.vinylOff)continue;
    let v=null;try{const f=await wkFindVinyl(src);if(f)v=await wkVinylFrom(f.id)}catch(e){if(/로그인|Secrets|functions/.test(e.message))break}
    /* 저장 전(상세 화면이 떠 있는 새 앨범)이면 저장될 때까지 잠깐 기다림 */
    for(let k=0;k<60;k++){const it=items.find(i=>i.id==id);if(it){it.vinylTried=1;if(v&&!it.vinyl&&!it.vinylOff){it.vinyl=v;if(OV.cat=='all')ovRender()}break}if(!draft)break;await wkSleep(2000)}
    await wkSleep(1500)}}
  finally{WKQ.run=false}}
/* 시작할 때: 아직 안 찾아본 앨범들 */
(async()=>{for(let k=0;k<30&&!(wkOn()&&rvReady);k++)await wkSleep(1000);if(!wkOn())return;
  items.filter(i=>i.cat=='u'&&!i.vinyl&&!i.vinylTried&&!i.vinylOff).forEach(i=>wkAutoVinyl(i.id))})();
/* 예전에 넣은 책: 저자·출판사·쪽수·판형·알라딘 표지를 한 번 채움 (bkTried 2 = 알라딘까지 물어봄. 1 = 알라딘 키 없던 때라 하루 뒤 다시) */
(async()=>{for(let k=0;k<30&&!(wkOn()&&rvReady);k++)await wkSleep(1000);if(!wkOn())return;await wkSleep(8000);let ch=0;
  for(const it of items.filter(i=>i.cat=='b'&&i.src&&i.src.isbn&&(!i.bkTried||(i.bkTried<2&&Date.now()-(i.bkAt||0)>864e5)))){
    try{const d=await wk({a:'detail',cat:'b',id:it.src.isbn}),info=wkBookInfo(d);
      if(it.au)delete info.au;if(it.pub)delete info.pub;Object.assign(it,info);if(!it.pages&&d.pages)it.pages=d.pages;
      if(d.alFound&&!it.bkCov){const p=await wkBookImg(d);if(p){it.img=p.src;it.c=p.c;delete it._covImg}it.bkCov=1}ch=1}
    catch(e){if(/로그인|Secrets|functions/.test(e.message))break;it.bkTried=/찾지/.test(e.message)?2:(it.bkTried||1);it.bkAt=Date.now()}
    await wkSleep(700)}
  if(ch&&(OV.cat=='all'||OV.cat=='b'))ovRender()})();
/* 예전에 넣은 영화 (0.20.2 전): 포스터·로고가 한국어판으로 저장돼 있어서, 원어판 포스터·영어 로고로 한 번 바꿔 줌 (langV).
   직접 고른 포스터(posterPick)·직접 넣은 로고(logoUp)는 그대로 둬요. 한 편씩 천천히. */
(async()=>{for(let k=0;k<30&&!(wkOn()&&rvReady);k++)await wkSleep(1000);if(!wkOn())return;await wkSleep(6000);
  const todo=()=>items.find(i=>i&&i.cat=='m'&&i.src&&i.src.tmdb&&!i.langV&&!i._langTry);let n=0;
  for(let it=todo();it;it=todo()){it._langTry=1;
    try{const d=await wk({a:'detail',cat:'m',id:it.src.tmdb});
      const p=!it.posterPick&&d.img?await wkImg(d.img,720).catch(()=>null):null,lg=d.logo?await wkImg(d.logo,600).catch(()=>null):null;
      if(p){it.img=p.src;it.c=p.c;delete it._covImg}
      if(lg)it.logo=lg.src;
      if(d.en&&d.en!=d.title&&!it.en)it.en=d.en;
      if(!it.stillUrl&&d.stills&&d.stills[0])it.stillUrl=d.stills[0];
      it.langV=1;n++;
      if(n%4==0){try{render();ovRender()}catch(e){}}}
    catch(e){if(/로그인|Secrets|functions|서버에 닿지|Failed to fetch/.test(e.message))return}
    await wkSleep(1200)}
  if(n){try{render();ovRender()}catch(e){}}})();

/* 바이닐 사진 바꾸기: 판 고르기 → 사진 고르기 (지금 것 표시) */

    res.onclick=e=>{const b=e.target.closest('[data-wkv]');if(b)wkVImgs(it,+b.dataset.wkv)}}
  catch(e){const res=$('#res');if(res)res.innerHTML=`<div class="wkm">${wkEsc(WK_MSG(e))}</div>`}}
async function wkVImgs(it,id){const res=$('#res');res.innerHTML='<div class="wkm">사진 불러오는 중…</div>';
  try{const r=await wk({a:'vimages',id});const im=r.images;if(!im.length){res.innerHTML='<div class="wkm">이 판에는 사진이 없어요</div>';return}
    const same=it.vinyl&&it.vinyl.id==r.id,pick={f:same?it.vinyl.fi??0:Math.max(0,im.findIndex(i=>i.primary)),d:same?it.vinyl.di??-1:-1};
    const draw=()=>{res.innerHTML=`<div class="wkcap"><span>${wkEsc(r.title)}</span><span>${[r.year,r.country].filter(Boolean).join(' · ')}</span></div>
      <div class="wkg">${im.map((x,k)=>`<div class="wki${pick.f==k?' f':''}${pick.d==k?' d':''}"><img src="${wkEsc(x.src)}" alt="" loading="lazy"><span><button data-wkf="${k}">앞면</button><button data-wkd="${k}">판</button></span></div>`).join('')}</div>
      <p class="wkft"><span>판 사진이 없으면 앨범 커버로 라벨을 그려요</span><span>front · disc</span></p>

        catch(er){toast(WK_MSG(er));t.disabled=false;t.textContent='이 사진으로'}return}
      draw()}}
  catch(e){res.innerHTML=`<div class="wkm">${wkEsc(WK_MSG(e))}</div>`}}

/* ---------- 스팀 라이브러리 ---------- */
const WK_STEAM='girok-steam';
const wkLS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return ''}};
function wkSteam(){
  wkSheet('스팀에서 불러오기','steam library',`<label class="wkin"><small>프로필 주소 profile</small><input id="wksp" placeholder="steamcommunity.com/…" value="${wkEsc(wkLS(WK_STEAM))}" autocomplete="off"></label>
  <div class="wkx"><button class="wkb" data-wkgo>목록 불러오기 <small>load</small></button></div><div class="wkres" id="res"></div>
  <p class="wkft"><span>'게임 세부 정보'가 공개여야 해요 · 이미 넣은 게임은 플레이 시간만 맞춰요</span><span>Steam</span></p>`);
  const go=()=>wkSteamLoad($('#wksp').value.trim());
  $('.sheet .wkx').onclick=e=>{if(e.target.closest('[data-wkgo]'))go()};
  $('#wksp').onkeydown=e=>{if(e.key=='Enter')go()};
  if(wkLS(WK_STEAM))go()}
async function wkSteamLoad(p){const res=$('#res');if(!p){res.innerHTML='<div class="wkm">프로필 주소를 넣어 주세요</div>';return}
  res.innerHTML='<div class="wkm">불러오는 중…</div>';
  try{const r=await wk({a:'steam',profile:p});wkLS(WK_STEAM,p);
    /* 이미 있는 게임: 플레이 시간 맞추기 */
    let up=0;r.games.forEach(g=>{const it=items.find(i=>i.cat=='g'&&i.steam==g.appid);if(it){const h=Math.round(g.mins/60);if(h>it.hours){it.hours=h;up++}}});
    if(up){render();ovRender()}
    const have=new Set(items.filter(i=>i.cat=='g'&&i.steam).map(i=>i.steam)),sel=new Set();
    const draw=()=>{res.innerHTML=`<div class="wkcap"><span>${r.games.length}개 · 고른 ${sel.size}개${up?` · 플레이 시간 ${up}개 맞춤`:''}</span><span>owned</span></div>
      ${r.games.map(g=>wkRow(`data-wks="${g.appid}"${have.has(g.appid)?' disabled':''}${sel.has(g.appid)?' class="wkr on"':''}`,g.img2,g.title,`${g.mins?`${Math.round(g.mins/6)/10}시간`:'안 해 봄'}${g.last?' · 마지막 '+g.last:''}${have.has(g.appid)?' · 이미 있음':''}`,false,'<i class="wkck"></i>')).join('')}
      <button class="wksave" data-wkadd2${sel.size?'':' disabled'}>고른 게임 넣기</button>`;
